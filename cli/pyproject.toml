[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "i2g-admin"
version = "0.2.0"
description = "Terminal CLI for remote record management of the Innovate-To-Grow backend via OAuth2 + PKCE."
requires-python = ">=3.11"
dependencies = [
    # Keep Click explicit because Typer also supports programmatic use without
    # its CLI dependency. This tested pair preserves global
    # --profile/--output/--query handling and includes Click's 2026 security fix.
    "click==8.3.3",
    "typer==0.18.0",
    "requests>=2.31",
    "rich>=13",
    "pyyaml>=6",
    "jmespath>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
]

[project.scripts]
i2g-admin = "i2g_admin.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["i2g_admin"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
