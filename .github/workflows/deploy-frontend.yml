name: Deploy Frontend to AWS Amplify

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Full commit SHA from the successful CI run.
        required: true
        type: string

permissions:
  id-token: write
  actions: read
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    environment:
      name: AWS Amplify - Prod
      url: https://i2g.ucmerced.edu
    defaults:
      run:
        working-directory: pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::394167325273:role/itg-prod-frontend-deployer
          allowed-account-ids: "394167325273"
          role-session-name: deploy-${{ github.run_id }}
          aws-region: us-west-2

      - name: Load deployment configuration from AWS
        working-directory: .
        run: python scripts/deploy/load_config.py frontend

      - name: Validate required deploy configuration
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL || 'https://api.i2g.ucmerced.edu' }}
          AMPLIFY_APP_ID: ${{ env.AMPLIFY_APP_ID }}
        run: |
          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "::error::AMPLIFY_APP_ID is required for the Amplify deployment."
            exit 1
          fi
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is required for the Amplify build."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL || 'https://api.i2g.ucmerced.edu' }}

      - name: Deploy to AWS Amplify
        id: deploy-amplify
        env:
          AMPLIFY_APP_ID: ${{ env.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ env.AMPLIFY_BRANCH || 'main' }}
        run: |
          # Create a deployment and get the upload URL + job ID
          DEPLOY_RESULT=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH")

          JOB_ID=$(echo "$DEPLOY_RESULT" | jq -r '.jobId')
          UPLOAD_URL=$(echo "$DEPLOY_RESULT" | jq -r '.zipUploadUrl')

          echo "Job ID: $JOB_ID"

          # Zip the build output
          cd dist
          zip -r ../build.zip .
          cd ..

          # Upload the zip to the pre-signed URL
          curl --fail --show-error --silent -T build.zip "$UPLOAD_URL" \
            -H "Content-Type: application/zip"

          # Start the deployment
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$JOB_ID"

          echo "job-id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment started successfully (Job ID: $JOB_ID). Check Amplify console for status."

      - name: Wait for Amplify deployment to finish
        env:
          AMPLIFY_APP_ID: ${{ env.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ env.AMPLIFY_BRANCH || 'main' }}
          JOB_ID: ${{ steps.deploy-amplify.outputs.job-id }}
        run: |
          set -euo pipefail

          while true; do
            status="$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)"
            echo "Amplify job $JOB_ID status: $status"

            case "$status" in
              SUCCEED)
                exit 0
                ;;
              FAILED|CANCELLED)
                aws amplify get-job \
                  --app-id "$AMPLIFY_APP_ID" \
                  --branch-name "$AMPLIFY_BRANCH" \
                  --job-id "$JOB_ID" \
                  --output json
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

      - name: Smoke check deployed frontend
        env:
          FRONTEND_URL: ${{ env.FRONTEND_URL || 'https://i2g.ucmerced.edu' }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL || 'https://api.i2g.ucmerced.edu' }}
        run: |
          set -euo pipefail

          frontend="${FRONTEND_URL%/}"
          api="${VITE_API_BASE_URL%/}"

          for url in "$frontend/" "$frontend/robots.txt" "$frontend/sitemap.xml" "$api/readyz/"; do
            echo "Checking $url"
            curl --fail --show-error --silent --location --max-time 30 "$url" >/tmp/smoke-body
            if [ ! -s /tmp/smoke-body ]; then
              echo "::error::Smoke target returned an empty body: $url"
              exit 1
            fi
          done
