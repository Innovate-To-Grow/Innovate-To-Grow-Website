name: Deploy Frontend to AWS Amplify

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Full commit SHA whose CI artifact must be deployed.
        required: true
        type: string
      ci_run_id:
        description: Successful CI run ID that produced the frontend artifacts.
        required: true
        type: string
    secrets:
      AMPLIFY_APP_ID:
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ inputs.deploy_sha }}
  CI_RUN_ID: ${{ inputs.ci_run_id }}

jobs:
  gate:
    name: Select immutable frontend artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci_run_id: ${{ steps.gate.outputs.ci-run-id }}
      deploy_sha: ${{ steps.gate.outputs.deploy-sha }}
      should_deploy: ${{ steps.gate.outputs.should-deploy }}
    steps:
      - name: Validate SHA and inspect the artifact-producing CI run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::deploy_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if ! printf '%s' "$CI_RUN_ID" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::ci_run_id must be a positive GitHub Actions run ID."
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          run_sha="$(jq --raw-output '.head_sha' <<<"$run_json")"
          run_conclusion="$(jq --raw-output '.conclusion' <<<"$run_json")"
          if [ "$run_sha" != "$DEPLOY_SHA" ] || [ "$run_conclusion" != "success" ]; then
            echo "::error::CI run $CI_RUN_ID is not a successful run for $DEPLOY_SHA."
            exit 1
          fi
          echo "deploy-sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "ci-run-id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_call" ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          successful_builds="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?per_page=100" \
              --jq \
              '[.jobs[] | select(.name | startswith("Frontend Deploy Build Artifact")) | select(.conclusion == "success")] | length' \
              | awk '{total += $1} END {print total + 0}'
          )"
          if [ "$successful_builds" -gt 0 ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "Frontend was unchanged; this CI run published no deploy artifact." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy Frontend (${{ matrix.target }})
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod
            artifact_name: frontend-dist-prod
            environment_name: AWS Amplify - Prod
            environment_url: https://i2g.ucmerced.edu
            frontend_url: https://i2g.ucmerced.edu
            api_base_url: https://api.i2g.ucmerced.edu
            backend_proxy_url: https://api.i2g.ucmerced.edu
            proxy_admin_paths: "false"
          - target: demo
            artifact_name: frontend-dist-demo
            environment_name: AWS Amplify(DEMO) - Prod
            environment_url: https://demo.i2g.ucmerced.edu
            frontend_url: https://demo.i2g.ucmerced.edu
            api_base_url: https://demo.i2g.ucmerced.edu/api
            backend_proxy_url: https://demo-api.i2g.ucmerced.edu
            proxy_admin_paths: "true"
    environment:
      name: ${{ matrix.environment_name }}
      url: ${{ matrix.environment_url }}
    defaults:
      run:
        working-directory: pages
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
      CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID || secrets.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH || 'main' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || matrix.frontend_url }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || matrix.api_base_url }}
      AMPLIFY_BACKEND_PROXY_URL: ${{ vars.AMPLIFY_BACKEND_PROXY_URL || matrix.backend_proxy_url }}
      AMPLIFY_PROXY_ADMIN_PATHS: ${{ vars.AMPLIFY_PROXY_ADMIN_PATHS || matrix.proxy_admin_paths }}
      AMPLIFY_CSP_MODE: ${{ vars.AMPLIFY_CSP_MODE || 'report-only' }}
      AMPLIFY_CSP_FRAME_SOURCES: ${{ vars.AMPLIFY_CSP_FRAME_SOURCES }}

    steps:
      - name: Checkout the CI-tested configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deploy configuration and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ROLE_ARN AMPLIFY_APP_ID AMPLIFY_BRANCH FRONTEND_URL \
            VITE_API_BASE_URL AMPLIFY_CSP_FRAME_SOURCES; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required config: ${missing[*]}"
            exit 1
          fi
          case "$AMPLIFY_CSP_MODE" in
            report-only|enforce) ;;
            *)
              echo "::error::AMPLIFY_CSP_MODE must be report-only or enforce."
              exit 1
              ;;
          esac

          python ../.github/scripts/render_amplify_headers.py \
            --api-base-url "$VITE_API_BASE_URL" \
            --backend-proxy-url "$AMPLIFY_BACKEND_PROXY_URL" \
            --frame-sources "$AMPLIFY_CSP_FRAME_SOURCES" \
            --mode "$AMPLIFY_CSP_MODE" \
            --output /tmp/custom-headers-validation.yml

          artifact_count="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100" \
              --jq \
              ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false) | .id" \
              | wc -l \
              | tr -d ' '
          )"
          if [ "$artifact_count" != "1" ]; then
            echo "::error::Expected one unexpired $ARTIFACT_NAME artifact in CI run $CI_RUN_ID; found $artifact_count."
            exit 1
          fi

      - name: Download the exact CI-built frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.artifact_name }}
          path: pages/dist
          github-token: ${{ github.token }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: i2g-deploy-frontend-${{ matrix.target }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render Amplify security headers
        run: |
          python ../.github/scripts/render_amplify_headers.py \
            --api-base-url "$VITE_API_BASE_URL" \
            --backend-proxy-url "$AMPLIFY_BACKEND_PROXY_URL" \
            --frame-sources "$AMPLIFY_CSP_FRAME_SOURCES" \
            --mode "$AMPLIFY_CSP_MODE" \
            --output custom-headers.yml

      - name: Configure Amplify rewrites and security headers
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess


          app_id = os.environ["AMPLIFY_APP_ID"].strip()
          backend_proxy_url = (
              os.environ["AMPLIFY_BACKEND_PROXY_URL"].strip().rstrip("/")
              or os.environ["VITE_API_BASE_URL"].strip().rstrip("/")
          )
          proxy_admin_paths = os.environ["AMPLIFY_PROXY_ADMIN_PATHS"].strip().lower() in {
              "1",
              "true",
              "yes",
              "on",
          }

          app_payload = subprocess.check_output(
              ["aws", "amplify", "get-app", "--app-id", app_id, "--output", "json"],
              text=True,
          )
          app = json.loads(app_payload)["app"]
          existing_rules = app.get("customRules") or []

          sitemap_rule = {
              "source": "/sitemap.xml",
              "target": f"{backend_proxy_url}/sitemap.xml",
              "status": "200",
          }
          api_rule = {
              "source": "/api/<*>",
              "target": f"{backend_proxy_url}/<*>",
              "status": "200",
          }
          admin_rules = [
              {
                  "source": "/admin",
                  "target": f"{backend_proxy_url}/admin/",
                  "status": "200",
              },
              {
                  "source": "/admin/<*>",
                  "target": f"{backend_proxy_url}/admin/<*>",
                  "status": "200",
              },
              {
                  "source": "/static/<*>",
                  "target": f"{backend_proxy_url}/static/<*>",
                  "status": "200",
              },
              {
                  "source": "/media/<*>",
                  "target": f"{backend_proxy_url}/media/<*>",
                  "status": "200",
              },
          ]
          spa_rule = {
              "source": (
                  r"</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|webp|avif|"
                  r"woff|woff2|ttf|otf|eot|map|json|xml|webmanifest)$)([^.]+$)/>"
              ),
              "target": "/index.html",
              "status": "200",
          }
          managed_sources = {
              sitemap_rule["source"],
              api_rule["source"],
              *(rule["source"] for rule in admin_rules),
          }
          preserved = [
              rule
              for rule in existing_rules
              if rule.get("source") not in managed_sources
              and rule.get("target") != "/index.html"
          ]
          custom_rules = [sitemap_rule, api_rule]
          if proxy_admin_paths:
              custom_rules.extend(admin_rules)
          custom_rules.extend(preserved)
          custom_rules.append(spa_rule)
          with open("custom-rules.json", "w", encoding="utf-8") as rules_file:
              json.dump(custom_rules, rules_file)

          with open("custom-headers.yml", encoding="utf-8") as headers_file:
              custom_headers = headers_file.read()

          subprocess.check_call(
              [
                  "aws",
                  "amplify",
                  "update-app",
                  "--app-id",
                  app_id,
                  "--custom-rules",
                  "file://custom-rules.json",
                  "--custom-headers",
                  custom_headers,
              ]
          )
          PY

      - name: Upload the immutable artifact to Amplify
        id: deploy-amplify
        run: |
          set -euo pipefail
          deploy_result="$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH")"
          job_id="$(jq --raw-output '.jobId' <<<"$deploy_result")"
          upload_url="$(jq --raw-output '.zipUploadUrl' <<<"$deploy_result")"
          if [ -z "$job_id" ] || [ "$job_id" = "null" ] ||
             [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
            echo "::error::Amplify did not return a job ID and upload URL."
            exit 1
          fi

          (
            cd dist
            zip --quiet --recurse-paths ../build.zip .
          )
          curl --fail --show-error --silent \
            --request PUT \
            --upload-file build.zip \
            --header "Content-Type: application/zip" \
            "$upload_url"
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$job_id" \
            --output json >/dev/null
          echo "job-id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify deployment
        env:
          JOB_ID: ${{ steps.deploy-amplify.outputs.job-id }}
        run: |
          set -euo pipefail
          deadline="$((SECONDS + 900))"
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)"
            echo "Amplify job $JOB_ID status: $status"
            case "$status" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED)
                aws amplify get-job \
                  --app-id "$AMPLIFY_APP_ID" \
                  --branch-name "$AMPLIFY_BRANCH" \
                  --job-id "$JOB_ID" \
                  --output json
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Amplify job $JOB_ID did not finish within 15 minutes."
          exit 1

      - name: Smoke check HTML, bundled JavaScript, rewrites, and CSP
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          html="$(mktemp)"
          curl --fail --show-error --silent --location --max-time 30 \
            --dump-header "$headers" \
            --output "$html" \
            "${FRONTEND_URL%/}/"
          python - \
            "$headers" \
            "$html" \
            "$FRONTEND_URL" \
            "$AMPLIFY_CSP_MODE" \
            "$AMPLIFY_BACKEND_PROXY_URL" \
            "$AMPLIFY_CSP_FRAME_SOURCES" <<'PY'
          import re
          import sys
          from email.parser import BytesParser
          from urllib.parse import urljoin, urlparse

          sys.path.insert(0, "../.github/scripts")
          from render_amplify_headers import origin, parse_frame_sources

          (
              header_path,
              html_path,
              frontend_url,
              csp_mode,
              backend_proxy_url,
              frame_sources,
          ) = sys.argv[1:]
          raw_headers = open(header_path, "rb").read().replace(b"\r\n", b"\n")
          final_header_lines = raw_headers.strip().split(b"\n\n")[-1].splitlines()
          headers = BytesParser().parsebytes(
              b"\r\n".join(final_header_lines[1:]) + b"\r\n\r\n"
          )
          content_type = headers.get("Content-Type", "")
          if "text/html" not in content_type.lower():
              raise SystemExit(f"Unexpected root Content-Type: {content_type!r}")

          expected_header = (
              "Content-Security-Policy"
              if csp_mode == "enforce"
              else "Content-Security-Policy-Report-Only"
          )
          csp = headers.get(expected_header, "")
          if not csp:
              raise SystemExit(f"{expected_header} is missing.")
          directives = {
              item.strip().split(maxsplit=1)[0]: item.strip()
              for item in csp.split(";")
              if item.strip()
          }
          script_src = directives.get("script-src", "")
          for source in (
              "'self'",
              "https://cdn.userway.org",
              "https://siteimproveanalytics.com",
          ):
              if source not in script_src.split():
                  raise SystemExit(f"script-src is missing {source}: {script_src}")
          if "'unsafe-inline'" in script_src or "'unsafe-eval'" in script_src:
              raise SystemExit(f"Unsafe script policy detected: {script_src}")
          frame_src = directives.get("frame-src", "")
          for source in parse_frame_sources(frame_sources):
              if source not in frame_src.split():
                  raise SystemExit(f"frame-src is missing CMS origin {source}: {frame_src}")
          expected_report_uri = (
              f"report-uri {origin(backend_proxy_url, 'AMPLIFY_BACKEND_PROXY_URL')}/csp-report/"
          )
          if directives.get("report-uri") != expected_report_uri:
              raise SystemExit(
                  f"Expected {expected_report_uri!r}; got {directives.get('report-uri')!r}."
              )

          html = open(html_path, encoding="utf-8").read()
          if not re.search(r'<div\s+id=["\']root["\']', html):
              raise SystemExit("Root HTML does not contain the React mount element.")
          sources = re.findall(r'<script[^>]+src=["\']([^"\']+)', html)
          if not sources:
              raise SystemExit("Root HTML does not load a JavaScript bundle.")
          frontend_origin = (
              f"{urlparse(frontend_url).scheme}://{urlparse(frontend_url).netloc}"
          )
          for source in sources:
              if urlparse(urljoin(frontend_url, source)).netloc != urlparse(
                  frontend_origin
              ).netloc:
                  raise SystemExit(
                      f"Third-party script remains inline in index.html: {source}"
                  )
          PY
          asset_url="$(
            python - "$html" "$FRONTEND_URL" <<'PY'
          import re
          import sys
          from urllib.parse import urljoin

          html = open(sys.argv[1], encoding="utf-8").read()
          source = re.findall(r'<script[^>]+src=["\']([^"\']+)', html)[0]
          print(urljoin(sys.argv[2].rstrip("/") + "/", source))
          PY
          )"
          asset_type="$(curl --fail --show-error --silent --location \
            --max-time 30 \
            --output /tmp/frontend-bundle.js \
            --write-out '%{content_type}' \
            "$asset_url")"
          case "$asset_type" in
            *javascript*) ;;
            *)
              echo "::error::Unexpected JavaScript bundle Content-Type: $asset_type"
              exit 1
              ;;
          esac
          test -s /tmp/frontend-bundle.js

          for path in robots.txt sitemap.xml; do
            curl --fail --show-error --silent --location --max-time 30 \
              "${FRONTEND_URL%/}/$path" > "/tmp/$path"
            test -s "/tmp/$path"
          done
