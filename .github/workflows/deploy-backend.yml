name: Deploy Backend to AWS ECS

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Full commit SHA from the successful CI run.
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: itg-backend
  ECS_CLUSTER: itg-backend-cluster
  ECS_SERVICE: itg-backend-service
  ECS_TASK_DEFINITION: aws/task-definition.json
  CONTAINER_NAME: itg-backend

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: AWS ECS - Prod
      url: https://api.i2g.ucmerced.edu
    env:
      AWS_REGION: us-west-2
      ECR_REPOSITORY: itg-backend
      ECS_CLUSTER: itg-backend-cluster
      ECS_SERVICE: itg-backend-service
      ECS_TASK_DEFINITION: aws/task-definition.json
      CONTAINER_NAME: itg-backend
      ECS_TASK_FAMILY: itg-backend
      ECS_LOG_GROUP: /ecs/itg-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::394167325273:role/itg-prod-backend-deployer
          allowed-account-ids: "394167325273"
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load deployment configuration from AWS
        working-directory: .
        run: python scripts/deploy/load_config.py backend

      - name: Validate required deployment configuration
        env:
          DJANGO_SECRET_KEY_SECRET_ARN: ${{ env.DJANGO_SECRET_KEY_SECRET_ARN }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD_SECRET_ARN: ${{ env.DB_PASSWORD_SECRET_ARN }}
          AWS_STORAGE_BUCKET_NAME: ${{ env.AWS_STORAGE_BUCKET_NAME || 'itg-static-assets' }}
          BACKEND_URL: ${{ env.BACKEND_URL || 'https://api.i2g.ucmerced.edu' }}
          ECS_EXECUTION_ROLE_ARN: ${{ env.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ env.ECS_TASK_ROLE_ARN }}
        run: |
          missing=()
          for name in DJANGO_SECRET_KEY_SECRET_ARN DB_HOST DB_NAME DB_USER DB_PASSWORD_SECRET_ARN AWS_STORAGE_BUCKET_NAME BACKEND_URL ECS_EXECUTION_ROLE_ARN ECS_TASK_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required config: ${missing[*]}"
            exit 1
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve Docker image URI
        id: image
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$DEPLOY_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Pull published Docker image
        run: docker pull "${{ steps.image.outputs.image }}"

      # SECURITY: Production secret values must live in AWS Secrets Manager
      # or SSM Parameter Store. This workflow renders only valueFrom ARNs into
      # the ECS task definition so DescribeTaskDefinition cannot reveal secret
      # material. Store *_SECRET_ARN references in the AWS deployment configuration.

      - name: Upload Django static assets to S3
        env:
          IMAGE_URI: ${{ steps.image.outputs.image }}
          AWS_STORAGE_BUCKET_NAME: ${{ env.AWS_STORAGE_BUCKET_NAME || 'itg-static-assets' }}
          AWS_S3_REGION_NAME: ${{ env.AWS_S3_REGION_NAME || 'us-west-2' }}
        run: |
          set -euo pipefail

          # Extract baked static files from the image and sync to S3.
          # This avoids Django's collectstatic S3 backend which requires
          # s3:DeleteObject permissions we intentionally withhold from the
          # deploy user.
          CONTAINER_ID=$(docker create "$IMAGE_URI")
          docker cp "$CONTAINER_ID:/app/static" ./static-export
          docker rm "$CONTAINER_ID"

          aws s3 sync ./static-export "s3://${AWS_STORAGE_BUCKET_NAME}/static" \
            --region "${AWS_S3_REGION_NAME}" \
            --cache-control "max-age=86400" \
            --size-only

      - name: Render ECS task definition from template
        id: task-def
        env:
          IMAGE_URI: ${{ steps.image.outputs.image }}
          DJANGO_SECRET_KEY_SECRET_ARN: ${{ env.DJANGO_SECRET_KEY_SECRET_ARN }}
          DB_ENGINE: ${{ env.DB_ENGINE }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD_SECRET_ARN: ${{ env.DB_PASSWORD_SECRET_ARN }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_CONN_MAX_AGE: ${{ env.DB_CONN_MAX_AGE || '0' }}
          DB_CONN_HEALTH_CHECKS: ${{ env.DB_CONN_HEALTH_CHECKS || 'true' }}
          REDIS_URL_SECRET_ARN: ${{ env.REDIS_URL_SECRET_ARN }}
          WEB_CONCURRENCY: ${{ env.WEB_CONCURRENCY || '2' }}
          UVICORN_LIMIT_CONCURRENCY: ${{ env.UVICORN_LIMIT_CONCURRENCY || '20' }}
          NUM_PROXIES: ${{ env.NUM_PROXIES || '1' }}
          DJANGO_SUPERUSER_USERNAME: ${{ env.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ env.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_FIRST_NAME: ${{ env.DJANGO_SUPERUSER_FIRST_NAME || 'I2G' }}
          DJANGO_SUPERUSER_LAST_NAME: ${{ env.DJANGO_SUPERUSER_LAST_NAME || 'Admin' }}
          DJANGO_SUPERUSER_PASSWORD_SECRET_ARN: ${{ env.DJANGO_SUPERUSER_PASSWORD_SECRET_ARN }}
          ENSURE_DEFAULT_ADMIN: ${{ env.ENSURE_DEFAULT_ADMIN || 'false' }}
          FRONTEND_URL: ${{ env.FRONTEND_URL || 'https://i2g.ucmerced.edu' }}
          BACKEND_URL: ${{ env.BACKEND_URL || 'https://api.i2g.ucmerced.edu' }}
          API_BASE_URL: ${{ env.VITE_API_BASE_URL || 'https://api.i2g.ucmerced.edu' }}
          LEGACY_VIEW_ENABLED: ${{ env.LEGACY_VIEW_ENABLED || 'false' }}
          LEGACY_ORIGIN_URL: ${{ env.LEGACY_ORIGIN_URL }}
          LEGACY_VIEWER_URL: ${{ env.LEGACY_VIEWER_URL }}
          LEGACY_ORIGIN_HEADER_NAME: ${{ env.LEGACY_ORIGIN_HEADER_NAME }}
          LEGACY_CONNECT_TIMEOUT_SECONDS: ${{ env.LEGACY_CONNECT_TIMEOUT_SECONDS || '3' }}
          LEGACY_READ_TIMEOUT_SECONDS: ${{ env.LEGACY_READ_TIMEOUT_SECONDS || '15' }}
          LEGACY_ORIGIN_HEADER_SECRET_ARN: ${{ env.LEGACY_ORIGIN_HEADER_SECRET_ARN }}
          DJANGO_ALLOWED_HOSTS: ${{ env.DJANGO_ALLOWED_HOSTS }}
          CSRF_TRUSTED_ORIGINS: ${{ env.CSRF_TRUSTED_ORIGINS }}
          CORS_ALLOWED_ORIGINS: ${{ env.CORS_ALLOWED_ORIGINS }}
          AWS_STORAGE_BUCKET_NAME: ${{ env.AWS_STORAGE_BUCKET_NAME || 'itg-static-assets' }}
          AWS_S3_REGION_NAME: ${{ env.AWS_S3_REGION_NAME || 'us-west-2' }}
          AMPLIFY_APP_ID: ${{ env.AMPLIFY_APP_ID }}
          AMPLIFY_BACKEND_PROXY_URL: ${{ env.AMPLIFY_BACKEND_PROXY_URL || 'https://api.i2g.ucmerced.edu' }}
          AMPLIFY_PROXY_ADMIN_PATHS: ${{ env.AMPLIFY_PROXY_ADMIN_PATHS || 'false' }}
          AMPLIFY_CONFIG_REVISION: ${{ github.run_id }}.${{ github.run_attempt }}
          BACKGROUND_JOBS_ENABLED: ${{ env.BACKGROUND_JOBS_ENABLED || 'false' }}
          BACKGROUND_JOB_METRICS_NAMESPACE: ${{ env.BACKGROUND_JOB_METRICS_NAMESPACE }}
          ECS_EXECUTION_ROLE_ARN: ${{ env.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ env.ECS_TASK_ROLE_ARN }}
          ECS_TASK_FAMILY: ${{ env.ECS_TASK_FAMILY }}
          ECS_LOG_GROUP: ${{ env.ECS_LOG_GROUP }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          template_path = "aws/task-definition.json"
          output_path = "rendered-task-definition.json"
          empty_sentinels = {"__EMPTY__", "__UNSET__", "null", "None"}

          def env_value(name: str, default: str = "") -> str:
              value = os.environ.get(name, default)
              if value is None:
                  return ""
              return "" if value in empty_sentinels else value

          with open(template_path, "r", encoding="utf-8") as f:
              taskdef = json.load(f)

          frontend_url = env_value("FRONTEND_URL").strip()
          backend_url = env_value("BACKEND_URL").strip()
          api_base_url = env_value("API_BASE_URL").strip()

          def url_origin(value: str) -> str:
              parsed = urlparse(value)
              if parsed.scheme and parsed.netloc:
                  return f"{parsed.scheme}://{parsed.netloc}"
              return value.rstrip("/")

          frontend_origin = url_origin(frontend_url)
          backend_origin = url_origin(backend_url)
          api_origin = url_origin(api_base_url)

          csrf_origins = env_value("CSRF_TRUSTED_ORIGINS").strip()
          if not csrf_origins:
              csrf_values = [x for x in [frontend_origin, backend_origin, api_origin] if x]
              csrf_origins = ",".join(csrf_values)

          cors_origins = env_value("CORS_ALLOWED_ORIGINS").strip() or frontend_origin

          configured_allowed_hosts = env_value("DJANGO_ALLOWED_HOSTS").strip()
          hosts = [host.strip() for host in configured_allowed_hosts.split(",") if host.strip()]
          for origin in [api_base_url, frontend_url, backend_url]:
              parsed = urlparse(origin)
              if parsed.hostname:
                  hosts.append(parsed.hostname)
          if not configured_allowed_hosts:
              hosts.extend([".cloudfront.net", ".elb.amazonaws.com"])
          allowed_hosts = ",".join(dict.fromkeys([h for h in hosts if h]))

          mapping = {
              "__TASK_FAMILY__": env_value("ECS_TASK_FAMILY", "itg-backend"),
              "__DJANGO_ALLOWED_HOSTS__": allowed_hosts,
              "__DB_NAME__": env_value("DB_NAME"),
              "__DB_USER__": env_value("DB_USER"),
              "__DB_HOST__": env_value("DB_HOST"),
              "__DB_PORT__": env_value("DB_PORT", "5432"),
              "__DB_CONN_MAX_AGE__": env_value("DB_CONN_MAX_AGE", "0"),
              "__DB_CONN_HEALTH_CHECKS__": env_value("DB_CONN_HEALTH_CHECKS", "true"),
              "__WEB_CONCURRENCY__": env_value("WEB_CONCURRENCY", "2"),
              "__UVICORN_LIMIT_CONCURRENCY__": env_value("UVICORN_LIMIT_CONCURRENCY", "20"),
              "__NUM_PROXIES__": env_value("NUM_PROXIES", "1"),
              "__CSRF_TRUSTED_ORIGINS__": csrf_origins,
              "__CORS_ALLOWED_ORIGINS__": cors_origins,
              "__FRONTEND_URL__": frontend_url,
              "__BACKEND_URL__": backend_url,
              "__AWS_STORAGE_BUCKET_NAME__": env_value("AWS_STORAGE_BUCKET_NAME", "itg-static-assets"),
              "__AWS_S3_REGION_NAME__": env_value("AWS_S3_REGION_NAME", "us-west-2"),
              "__AWS_REGION__": env_value("AWS_REGION", "us-west-2"),
              "__AMPLIFY_APP_ID__": env_value("AMPLIFY_APP_ID"),
              "__AMPLIFY_BACKEND_PROXY_URL__": env_value("AMPLIFY_BACKEND_PROXY_URL"),
              "__AMPLIFY_PROXY_ADMIN_PATHS__": env_value("AMPLIFY_PROXY_ADMIN_PATHS", "false"),
              "__AMPLIFY_CONFIG_REVISION__": env_value("AMPLIFY_CONFIG_REVISION"),
              "__BACKGROUND_JOBS_ENABLED__": env_value("BACKGROUND_JOBS_ENABLED", "false"),
              "__BACKGROUND_JOB_METRICS_NAMESPACE__": env_value("BACKGROUND_JOB_METRICS_NAMESPACE"),
              "__AWS_LOG_GROUP__": env_value("ECS_LOG_GROUP", "/ecs/itg-backend"),
              "__DJANGO_SUPERUSER_USERNAME__": env_value("DJANGO_SUPERUSER_USERNAME"),
              "__DJANGO_SUPERUSER_EMAIL__": env_value("DJANGO_SUPERUSER_EMAIL"),
              "__DJANGO_SUPERUSER_FIRST_NAME__": env_value("DJANGO_SUPERUSER_FIRST_NAME", "I2G"),
              "__DJANGO_SUPERUSER_LAST_NAME__": env_value("DJANGO_SUPERUSER_LAST_NAME", "Admin"),
              "__ENSURE_DEFAULT_ADMIN__": env_value("ENSURE_DEFAULT_ADMIN", "false"),
              "__LEGACY_VIEW_ENABLED__": env_value("LEGACY_VIEW_ENABLED", "false"),
              "__LEGACY_ORIGIN_URL__": env_value("LEGACY_ORIGIN_URL"),
              "__LEGACY_VIEWER_URL__": env_value("LEGACY_VIEWER_URL"),
              "__LEGACY_ORIGIN_HEADER_NAME__": env_value("LEGACY_ORIGIN_HEADER_NAME"),
              "__LEGACY_CONNECT_TIMEOUT_SECONDS__": env_value("LEGACY_CONNECT_TIMEOUT_SECONDS", "3"),
              "__LEGACY_READ_TIMEOUT_SECONDS__": env_value("LEGACY_READ_TIMEOUT_SECONDS", "15"),
          }
          secret_mapping = {
              "__DJANGO_SECRET_KEY_SECRET_ARN__": env_value("DJANGO_SECRET_KEY_SECRET_ARN"),
              "__DB_PASSWORD_SECRET_ARN__": env_value("DB_PASSWORD_SECRET_ARN"),
              "__REDIS_URL_SECRET_ARN__": env_value("REDIS_URL_SECRET_ARN"),
              "__DJANGO_SUPERUSER_PASSWORD_SECRET_ARN__": env_value("DJANGO_SUPERUSER_PASSWORD_SECRET_ARN"),
              "__LEGACY_ORIGIN_HEADER_SECRET_ARN__": env_value("LEGACY_ORIGIN_HEADER_SECRET_ARN"),
          }

          required_secret_placeholders = {
              "__DJANGO_SECRET_KEY_SECRET_ARN__",
              "__DB_PASSWORD_SECRET_ARN__",
          }
          if mapping["__ENSURE_DEFAULT_ADMIN__"].strip().lower() in {"1", "true", "yes", "on"}:
              if not mapping["__DJANGO_SUPERUSER_EMAIL__"].strip():
                  raise SystemExit("DJANGO_SUPERUSER_EMAIL is required when ENSURE_DEFAULT_ADMIN is true.")
              required_secret_placeholders.add("__DJANGO_SUPERUSER_PASSWORD_SECRET_ARN__")

          def require_secret_ref_arn(name: str, value: str) -> None:
              # Catch a pasted literal secret / typo'd name at render time:
              # a bad reference would otherwise register fine and only fail
              # at task launch, surfacing as a rolled-back deploy.
              if not value.startswith(("arn:aws:secretsmanager:", "arn:aws:ssm:")):
                  raise SystemExit(
                      f"{name} must be a Secrets Manager or SSM Parameter Store ARN "
                      "(arn:aws:secretsmanager:... or arn:aws:ssm:...)."
                  )

          # Substitute IAM role ARNs so the account ID is not baked into the
          # checked-in task-definition template.
          exec_role = env_value("ECS_EXECUTION_ROLE_ARN").strip()
          task_role = env_value("ECS_TASK_ROLE_ARN").strip()
          if not exec_role:
              raise SystemExit("ECS_EXECUTION_ROLE_ARN is required to render the ECS task definition.")
          if not task_role:
              raise SystemExit("ECS_TASK_ROLE_ARN is required to render the ECS task definition.")
          taskdef["executionRoleArn"] = exec_role
          taskdef["taskRoleArn"] = task_role

          containers = {container["name"]: container for container in taskdef.get("containerDefinitions", [])}
          try:
              web_container = containers["itg-backend"]
              worker_container = containers["itg-background-worker"]
          except KeyError as exc:
              raise SystemExit(f"Missing required ECS container: {exc.args[0]}") from exc

          taskdef["family"] = mapping["__TASK_FAMILY__"]

          # Render the web container once, then give the worker an exact deep
          # copy of its environment and secret references. This prevents a
          # newly-added runtime setting from silently reaching only one
          # process while still letting each container have its own command,
          # port, health check, and log stream prefix.
          web_container["image"] = os.environ["IMAGE_URI"]
          web_log_options = web_container.setdefault("logConfiguration", {}).setdefault("options", {})
          web_log_options["awslogs-group"] = mapping["__AWS_LOG_GROUP__"]
          web_log_options["awslogs-region"] = mapping["__AWS_REGION__"]

          for item in web_container.get("environment", []):
              value = item.get("value", "")
              if value in mapping:
                  item["value"] = mapping[value]

          rendered_secrets = []
          for item in web_container.get("secrets", []):
              value_from = item.get("valueFrom", "")
              if value_from not in secret_mapping:
                  rendered_secrets.append(item)
                  continue

              secret_arn = secret_mapping[value_from].strip()
              if not secret_arn:
                  if value_from in required_secret_placeholders:
                      raise SystemExit(f"{value_from.strip('_')} is required to render the ECS task definition.")
                  continue

              require_secret_ref_arn(value_from.strip("_"), secret_arn)
              item["valueFrom"] = secret_arn
              rendered_secrets.append(item)
          web_container["secrets"] = rendered_secrets

          # Optional DB_ENGINE override; prod defaults to PostgreSQL if unset.
          db_engine = env_value("DB_ENGINE").strip()
          if db_engine:
              web_container["environment"].append({"name": "DB_ENGINE", "value": db_engine})

          from copy import deepcopy

          WEB_ONLY_SECRETS = {"LEGACY_ORIGIN_HEADER_VALUE"}

          worker_container["image"] = web_container["image"]
          worker_container["environment"] = deepcopy(web_container["environment"])
          # The CloudFront origin secret authenticates inbound Web requests
          # only; the worker never serves HTTP, so it never receives it.
          worker_container["secrets"] = [
              deepcopy(item) for item in web_container["secrets"] if item["name"] not in WEB_ONLY_SECRETS
          ]
          worker_log_options = worker_container.setdefault("logConfiguration", {}).setdefault("options", {})
          worker_log_options["awslogs-group"] = mapping["__AWS_LOG_GROUP__"]
          worker_log_options["awslogs-region"] = mapping["__AWS_REGION__"]

          with open(output_path, "w", encoding="utf-8") as f:
              json.dump(taskdef, f, indent=2)
          PY
          python aws/validate_backend_task_definition.py rendered-task-definition.json --rendered
          echo "task-definition=rendered-task-definition.json" >> "$GITHUB_OUTPUT"

      - name: Run database migration before replacing the service
        run: python scripts/deploy/migrate_ecs.py rendered-task-definition.json

      - name: Deploy to ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment was not rolled back
        env:
          QUERY_PRIMARY: 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]'
          QUERY_EVENTS: 'services[0].events[0:5].message'
        run: |
          set -euo pipefail

          expected_taskdef="${{ steps.deploy-ecs.outputs.task-definition-arn }}"
          echo "Expected task definition: $expected_taskdef"

          # Get the primary deployment's task definition
          active_taskdef="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "$QUERY_PRIMARY" \
            --output text)"
          echo "Active task definition:   $active_taskdef"

          if [ "$active_taskdef" != "$expected_taskdef" ]; then
            echo "::error::Deployment rolled back! Expected $expected_taskdef but service is running $active_taskdef"
            echo "Checking recent ECS events for failure details..."
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "$QUERY_EVENTS" \
              --output table
            exit 1
          fi

          echo "Deployment verified: service is running the expected task definition."

      - name: Smoke check deployed health endpoint and CORS
        env:
          FRONTEND_URL: ${{ env.FRONTEND_URL || 'https://i2g.ucmerced.edu' }}
          API_BASE_URL: ${{ env.BACKEND_SMOKE_URL || env.VITE_API_BASE_URL || 'https://api.i2g.ucmerced.edu' }}
        run: |
          set -euo pipefail

          if [ -z "${FRONTEND_URL:-}" ]; then
            echo "FRONTEND_URL is required for smoke checks."
            exit 1
          fi

          if [ -z "${API_BASE_URL:-}" ]; then
            echo "VITE_API_BASE_URL is required for smoke checks."
            exit 1
          fi

          health_url="${API_BASE_URL%/}/readyz/"
          headers_file="$(mktemp)"
          headers_clean="$(mktemp)"
          body_file="$(mktemp)"

          status_code="$(curl -sS -D "$headers_file" -o "$body_file" \
            -H "Origin: $FRONTEND_URL" \
            "$health_url" \
            -w "%{http_code}")"

          tr -d '\r' < "$headers_file" > "$headers_clean"

          if [ "$status_code" != "200" ]; then
            echo "Readiness check failed with status $status_code"
            echo "Response headers:"
            cat "$headers_clean"
            echo "Response body:"
            cat "$body_file"
            exit 1
          fi

          cors_origin="$(awk -F': ' 'tolower($1) == "access-control-allow-origin" {print $2; exit}' "$headers_clean")"
          if [ "$cors_origin" != "$FRONTEND_URL" ]; then
            echo "Expected Access-Control-Allow-Origin: $FRONTEND_URL"
            echo "Actual Access-Control-Allow-Origin: ${cors_origin:-<missing>}"
            echo "Response headers:"
            cat "$headers_clean"
            exit 1
          fi

          python - <<'PY' "$body_file"
          import json
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              payload = json.load(f)

          if payload.get("status") not in ("ok", "maintenance"):
              raise SystemExit(f"Unexpected health payload: {payload}")
          PY

          echo "Readiness/CORS smoke check passed for $health_url"
