name: Dependency Audit

# Scheduled dependency audit, kept OUT of ci.yml on purpose.
#
# `npm audit` and `pip-audit` compare a committed lockfile against a live
# advisory database, so their result changes over time with no code change. CI
# only runs on push/pull_request, so a newly published advisory stays invisible
# until the next merge — and then turns main red on an unrelated commit.
#
# This is not a `schedule:` on ci.yml: a scheduled CI run would fail `CI Result`
# on whatever commit main happens to be at, and Deploy Production (which reacts
# to CI completing on main) would have to tell those runs apart. A separate
# workflow with a distinct name keeps both concerns out of CI.
on:
  schedule:
    # Mondays 04:00 UTC, an hour after the CodeQL scan.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22.22.2"

jobs:
  frontend-audit:
    name: Frontend npm Audit (scheduled)
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate

  backend-audit:
    name: Python Security Audit (scheduled)
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install pip-audit
        run: pip install "pip-audit[cyclonedx]==2.7.3"

      # Keep the --ignore-vuln list in sync with the `python-dependency-audit` job
      # in ci.yml; these are the same accepted advisories.
      - name: Audit Python dependencies
        run: |
          set -o pipefail
          pip-audit \
            --requirement requirements.txt \
            --progress-spinner off \
            --format columns \
            --ignore-vuln GHSA-mf9w-mj56-hr94 \
            --ignore-vuln GHSA-p998-jp59-783m \
            --ignore-vuln GHSA-hcc4-c3v8-rx92 \
            --ignore-vuln GHSA-m5qp-6w8w-w647 \
            --ignore-vuln GHSA-3wq7-rqq7-wx6j \
            --ignore-vuln GHSA-mwh4-6h8g-pg8w \
            --ignore-vuln GHSA-966j-vmvw-g2g9 \
            --ignore-vuln GHSA-63hf-3vf5-4wqf \
            --ignore-vuln GHSA-c427-h43c-vf67 \
            --ignore-vuln GHSA-w2fm-2cpv-w7v5 \
            --ignore-vuln GHSA-2vrm-gr82-f7m5 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2026-161 \
            | tee "$GITHUB_STEP_SUMMARY"
