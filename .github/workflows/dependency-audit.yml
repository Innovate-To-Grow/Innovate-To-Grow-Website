name: Dependency Audit

# Scheduled dependency audit, kept OUT of ci.yml on purpose.
#
# `npm audit` and `pip-audit` compare a committed lockfile against a live
# advisory database, so their result changes over time with no code change. CI
# only runs on push/pull_request, so a newly published advisory stays invisible
# until the next merge — and then turns main red on an unrelated commit.
#
# This is not a `schedule:` on ci.yml: a scheduled CI run would fail `CI Result`
# on whatever commit main happens to be at, and Deploy Production (which reacts
# to CI completing on main) would have to tell those runs apart. A separate
# workflow with a distinct name keeps both concerns out of CI.
on:
  schedule:
    # Mondays 04:00 UTC, an hour after the CodeQL scan.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22.22.2"

jobs:
  frontend-audit:
    name: Frontend npm Audit (scheduled)
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate

  backend-audit:
    name: Python Security Audit (scheduled)
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"

      # Accept an advisory here and in ci.yml's python-dependency-audit together,
      # each with `--ignore-vuln <ID>` and a comment naming what blocks the fix.
      # scripts/ci/validate_tool_versions.py fails while the two lists differ.
      - name: Audit Python dependencies
        run: |
          set -o pipefail
          pip-audit \
            --requirement requirements.txt \
            --progress-spinner off \
            --format columns \
            | tee "$GITHUB_STEP_SUMMARY"
