name: Deploy Archive to AWS ECS

# Builds the archived event-pages site (archive/page/) and deploys it to its
# own ECS Fargate service behind the shared prod ALB
# (host: archive.i2g.ucmerced.edu). The Google Sheets API key is injected by
# ECS at task launch from Secrets Manager / SSM via the task definition's
# `secrets` block. The secret ARN is loaded from AWS deployment configuration.

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Full commit SHA from the successful CI run.
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-archive-production
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: itg-archive
  ECS_CLUSTER: itg-backend-cluster
  ECS_SERVICE: itg-archive-service
  ECS_TASK_DEFINITION: aws/ecs/archive-task-definition.json
  CONTAINER_NAME: itg-archive

jobs:
  deploy:
    name: Build & Deploy Archive
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    environment:
      name: AWS ECS - Archive Prod
      url: https://archive.i2g.ucmerced.edu

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Set up deployment Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::394167325273:role/itg-prod-archive-deployer
          allowed-account-ids: "394167325273"
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load deployment configuration from AWS
        working-directory: .
        run: python scripts/deploy/load_config.py archive

      - name: Validate required deployment configuration
        env:
          SHEETS_API_KEY_SECRET_ARN: ${{ env.SHEETS_API_KEY_SECRET_ARN }}
          ECS_EXECUTION_ROLE_ARN: ${{ env.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ env.ECS_TASK_ROLE_ARN }}
        run: |
          missing=()
          for name in SHEETS_API_KEY_SECRET_ARN ECS_EXECUTION_ROLE_ARN ECS_TASK_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required config: ${missing[*]}"
            exit 1
          fi

      # SECURITY: SHEETS_API_KEY is injected by ECS from Secrets Manager or
      # SSM Parameter Store. Keep its ARN in the AWS deployment configuration.

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build archive image
        run: docker build -t "itg-archive-ci:${{ inputs.deploy_sha }}" archive/page/

      - name: Scan archive image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: itg-archive-ci:${{ inputs.deploy_sha }}
          # Install locally; hosted binary caches contain absolute paths.
          cache: false
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          python scripts/deploy/publish_image.py --repository "$ECR_REPOSITORY" \
            --registry "$ECR_REGISTRY" --tag "$IMAGE_TAG" --source "itg-archive-ci:$IMAGE_TAG"

      - name: Render ECS task definition from template
        id: task-def
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          SHEETS_API_KEY_SECRET_ARN: ${{ env.SHEETS_API_KEY_SECRET_ARN }}
          ECS_EXECUTION_ROLE_ARN: ${{ env.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ env.ECS_TASK_ROLE_ARN }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("aws/ecs/archive-task-definition.json", encoding="utf-8") as f:
              taskdef = json.load(f)

          exec_role = os.environ.get("ECS_EXECUTION_ROLE_ARN", "").strip()
          task_role = os.environ.get("ECS_TASK_ROLE_ARN", "").strip()
          if not exec_role or not task_role:
              raise SystemExit("ECS_EXECUTION_ROLE_ARN and ECS_TASK_ROLE_ARN are required.")
          taskdef["executionRoleArn"] = exec_role
          taskdef["taskRoleArn"] = task_role

          container = taskdef["containerDefinitions"][0]
          container["image"] = os.environ["IMAGE_URI"]

          sheets_api_key_secret = os.environ.get("SHEETS_API_KEY_SECRET_ARN", "").strip()
          if not sheets_api_key_secret:
              raise SystemExit("SHEETS_API_KEY_SECRET_ARN is required.")
          # Catch a pasted literal key / typo'd name at render time instead of
          # a rolled-back deploy at task launch.
          if not sheets_api_key_secret.startswith(("arn:aws:secretsmanager:", "arn:aws:ssm:")):
              raise SystemExit(
                  "SHEETS_API_KEY_SECRET_ARN must be a Secrets Manager or SSM Parameter Store ARN."
              )
          for item in container.get("secrets", []):
              if item.get("valueFrom") == "__SHEETS_API_KEY_SECRET_ARN__":
                  item["valueFrom"] = sheets_api_key_secret

          with open("rendered-archive-task-definition.json", "w", encoding="utf-8") as f:
              json.dump(taskdef, f, indent=2)
          PY
          echo "task-definition=rendered-archive-task-definition.json" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment was not rolled back
        env:
          QUERY_PRIMARY: 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]'
        run: |
          set -euo pipefail
          expected_taskdef="${{ steps.deploy-ecs.outputs.task-definition-arn }}"
          active_taskdef="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "$QUERY_PRIMARY" --output text)"
          echo "Expected: $expected_taskdef"
          echo "Active:   $active_taskdef"
          if [ "$active_taskdef" != "$expected_taskdef" ]; then
            echo "::error::Deployment rolled back!"
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].events[0:5].message' --output table
            exit 1
          fi

      - name: Smoke check deployed site over HTTPS
        run: |
          set -euo pipefail
          base="https://archive.i2g.ucmerced.edu"

          status="$(curl -sS -o /dev/null -w '%{http_code}' "$base/healthz")"
          if [ "$status" != "200" ]; then
            echo "Health check failed: $status"
            exit 1
          fi

          # A served page must carry the embed helper and not leak the key.
          page="$(curl -sS "$base/2025-fall-event.html")"
          echo "$page" | grep -q '/static/js/i2g-embed.js' || { echo "embed helper missing"; exit 1; }
          if echo "$page" | grep -q 'AIzaSy'; then
            echo "::error::API key leaked into a served page!"
            exit 1
          fi
          echo "Smoke check passed for $base"
