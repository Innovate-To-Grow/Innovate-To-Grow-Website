name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Weekly rescan of main (Mondays 03:00 UTC): new CodeQL queries surface
    # alerts even in a week without pushes.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    permissions:
      # Required for CodeQL to upload results to the Security tab.
      security-events: write
      # Required by CodeQL to read workflow metadata.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Excludes vendored, minified Drupal-7-era bundles under
          # archive/page/static/js/ from analysis (see config for rationale).
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended adds a handful of high-signal queries on top of
          # the default set (e.g., regex injection, path traversal) without
          # the noise of security-and-quality.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
