name: Code Style Check

on:
  workflow_call:
    inputs:
      run-python:
        description: Run backend Python linting.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  # Python (Django Backend) Linting
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    if: ${{ inputs.run-python }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.2 "bandit[toml]==1.7.10"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      # Size / complexity / nesting limits and app dependency boundaries. Hard
      # limits fail; advisory findings are printed only. Rules and exceptions:
      # docs/architecture/code-quality.md.
      - name: Check Python quality limits
        working-directory: .
        run: python scripts/ci/check_python_quality.py

      - name: Check Python app dependency boundaries
        working-directory: .
        run: python scripts/ci/check_python_dependencies.py

      # Bandit SAST — config lives in pyproject.toml [tool.bandit]. The
      # baseline pins pre-existing findings so only *new* issues break CI.
      # Update the baseline with `bandit -r src -c pyproject.toml -f json
      # -o .bandit-baseline.json` after resolving findings intentionally.
      - name: Run Bandit (with baseline)
        run: bandit -r . -c ../pyproject.toml --baseline ../.bandit-baseline.json
