name: CI

on:
  # The paths a push to main validates. scripts/ci/plan_changed_areas.py mirrors
  # this list: a pull request or merge group touching any of them runs the FULL
  # suite, exactly like the push that follows it (PR/push parity).
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "cli/**"
      - "pages/**"
      - "aws/**"
      - "scripts/**"
      - ".github/actionlint.yaml"
      - ".github/actions/**"
      - ".github/codeql/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".gitleaksignore"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".bandit-baseline.json"
      # Archived legacy static site. Every push to main runs the FULL suite (see
      # the `changes` job), so archive merges are validated end to end.
      - "archive/**"
  # No path filter: every pull request must report the required `CI Result`
  # check, or a ruleset requiring it would block docs-only pull requests
  # forever. `changes` runs nothing beyond the ungated checks when the diff
  # touches none of the push paths above, so such a run is green in minutes.
  pull_request:
  # The merge queue's group commit: the exact tree that lands on main. It is
  # planned from the group's diff exactly like a pull request (merge_group
  # events accept no path filter).
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled. A running push or merge-group
  # run is never cancelled, but GitHub keeps at most ONE pending run per group:
  # when a third push to main arrives while one run is in progress and one is
  # waiting, the waiting (older) run is cancelled. Only the newest main commit
  # is then guaranteed a complete push run; with the merge queue every merged
  # tree has already passed its own merge_group run (whose ref is unique).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  # Match the interpreter used by the production Docker image.
  BACKEND_PYTHON_VERSION: "3.14"
  NODE_VERSION: "22.22.2"
  DJANGO_SETTINGS_MODULE: config.settings.environments.test
  COVERAGE_VERSION: "7.16.1"
  CLI_COVERAGE_LINES: "99"
  CLI_COVERAGE_BRANCHES: "98"
  # Cache transport failures must fall back to dependency installation promptly.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
  # npm only retries registry reads on network/5xx errors; keep the extra
  # attempts short so deterministic lint, test, and audit failures stay red.
  NPM_CONFIG_FETCH_RETRIES: "3"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "2000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "8000"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            .pre-commit-config.yaml

      - name: Install preflight tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pre-commit==4.0.1" "PyYAML==6.0.2"
          ACTIONLINT_VERSION="1.7.7"
          ACTIONLINT_SHA256="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --retry-max-time 180 \
            --connect-timeout 10 --max-time 60 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Validate workflow syntax
        run: actionlint

      - name: Validate YAML, TOML, and JSON
        run: |
          pre-commit run check-yaml --all-files --show-diff-on-failure
          pre-commit run check-toml --all-files --show-diff-on-failure
          pre-commit run check-json --all-files --show-diff-on-failure

      - name: Validate tool version pins
        run: python scripts/ci/validate_tool_versions.py

      - name: Validate CI planner scripts
        run: python -m unittest discover -s scripts/ci/tests

      - name: Validate AWS runner trust boundary
        run: node --test aws/ci-runners/guard/trust.test.mjs

      - name: Validate Legacy viewer infrastructure
        run: python scripts/ci/validate_legacy_infrastructure.py

      - name: Validate Dependabot labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/validate_dependabot_labels.py

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      archive: ${{ steps.filter.outputs.archive }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed areas from the diff
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Pull requests and merge groups give both endpoints of their diff.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # A push to a default branch (main/master) always runs the FULL suite:
          # every area is validated on the branch that ships to production.
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "${EVENT_NAME}" != "merge_group" ]; then
            echo "Push/non-PR event (${EVENT_NAME}); running the full suite."
            {
              echo "backend=true"
              echo "frontend=true"
              echo "cli=true"
              echo "archive=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request or merge group runs the SAME areas the eventual push
          # to main runs, so a green check cannot become a red main run for the
          # same tree (see scripts/ci/plan_changed_areas.py). Fall back to the
          # full suite if no usable base exists.
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base SHA; running the full suite."
            {
              echo "backend=true"
              echo "frontend=true"
              echo "cli=true"
              echo "archive=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | tee "$RUNNER_TEMP/changed-files.txt"
          # All-or-nothing: any path a push to main would validate runs the full
          # suite; a diff touching none of them (docs, README) runs none.
          python scripts/ci/plan_changed_areas.py \
            --event-name "$EVENT_NAME" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  lint:
    name: Python Code Style Check
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/lint.yml
    with:
      run-python: true

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --retry-max-time 180 \
            --connect-timeout 10 --max-time 60 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks

      - name: Run gitleaks on PR/push diff
        env:
          # Pull requests and merge groups: every commit between base and head.
          # (HEAD^..HEAD alone would scan only a merge commit, whose diff git log
          # does not show.)
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            RANGE="${BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE}..${PUSH_HEAD}"
          else
            RANGE="HEAD^..HEAD"
          fi

          echo "Scanning commit range: $RANGE"
          /tmp/gitleaks/gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --no-banner \
            --log-opts "$RANGE" \
            --exit-code 1

  backend-checks:
    name: Backend Migration and Production Checks
    # Migration drift on PostgreSQL plus the production-settings checks: a venv
    # and a few manage.py calls, so a GitHub-hosted runner starts it faster than
    # an AWS cold boot. Not a dependency of the Django matrix: every test leg
    # applies all migrations to its own PostgreSQL test database anyway, and
    # backend-required-result still requires this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itg_ci
          POSTGRES_USER: itg_ci_user
          POSTGRES_PASSWORD: itg_ci_pass
        ports:
          - 5432:5432
        # Probe TCP: the image's init-only first-start server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U itg_ci_user -d itg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: src
    env:
      DB_NAME: itg_ci
      DB_USER: itg_ci_user
      DB_PASSWORD: itg_ci_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up backend virtualenv
        uses: ./.github/actions/setup-backend-venv
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}
          coverage-version: ${{ env.COVERAGE_VERSION }}

      - name: Check migration files are up to date
        run: .venv/bin/python manage.py makemigrations --check --dry-run

      - name: Apply migrations on PostgreSQL
        run: .venv/bin/python manage.py migrate --noinput

      - name: Ensure no pending migrations remain
        run: .venv/bin/python manage.py migrate --check

      # Placeholder production environment: the settings must import and pass
      # `check --deploy` without reaching any real service.
      - name: Import production settings and run Django deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.environments.production
          DJANGO_SECRET_KEY: ci-production-smoke-secret-key-with-enough-entropy-2026
          DJANGO_ALLOWED_HOSTS: api.example.com
          BACKEND_URL: https://api.example.com
          FRONTEND_URL: https://i2g.example.com
          DB_HOST: db.example.com
          AWS_STORAGE_BUCKET_NAME: itg-ci-static
          CSRF_TRUSTED_ORIGINS: https://i2g.example.com
          CORS_ALLOWED_ORIGINS: https://i2g.example.com
        run: |
          .venv/bin/python -c "import django; django.setup()"
          .venv/bin/python manage.py check --deploy

      - name: Dry-run collectstatic with CI settings
        run: .venv/bin/python manage.py collectstatic --dry-run --noinput --settings=config.settings.environments.test

  django-test-coverage:
    name: Django Test and Coverage (${{ matrix.app }})
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Every app on every event (PR/push parity). MatrixParityTests in
        # scripts/ci/tests/test_ci_workflow_invariants.py keeps this list equal
        # to src/apps/* and scripts/ci/backend_coverage_floors.json.
        app: [authn, core, system_intelligence, cms, event, projects, mail, cli_admin]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itg_ci
          POSTGRES_USER: itg_ci_user
          POSTGRES_PASSWORD: itg_ci_pass
        ports:
          - 5432:5432
        # Probe TCP: the image's init-only first-start server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U itg_ci_user -d itg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: src
    env:
      DJANGO_SETTINGS_MODULE: config.settings.environments.unit
      DB_NAME: itg_ci
      DB_USER: itg_ci_user
      DB_PASSWORD: itg_ci_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up backend virtualenv
        uses: ./.github/actions/setup-backend-venv
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}
          coverage-version: ${{ env.COVERAGE_VERSION }}

      - name: Run Django tests and enforce per-app coverage
        run: |
          .venv/bin/coverage run --branch \
            --source="apps.${{ matrix.app }}" \
            --omit="*/migrations/*,*/tests/*" \
            manage.py test "apps.${{ matrix.app }}"
          .venv/bin/coverage xml -o "coverage-${{ matrix.app }}.xml"
          .venv/bin/coverage json --pretty-print -o "coverage-${{ matrix.app }}.json"
          .venv/bin/python ../scripts/ci/check_backend_coverage.py \
            "coverage-${{ matrix.app }}.json" \
            ../scripts/ci/backend_coverage_floors.json \
            --app "${{ matrix.app }}"
          .venv/bin/python - <<'PY'
          import json
          import os

          app = os.environ["APP_UNDER_TEST"]
          summary_path = f"coverage-{app}.json"
          with open(summary_path, encoding="utf-8") as fh:
              totals = json.load(fh)["totals"]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"## Django coverage: {app}\n\n")
                  fh.write("| Metric | Covered | Total | Percent |\n")
                  fh.write("|---|---:|---:|---:|\n")
                  fh.write(
                      f"| Lines | {totals['covered_lines']} | {totals['num_statements']} | "
                      f"{totals['percent_covered_display']}% |\n"
                  )
          PY
          .venv/bin/coverage report -m
        env:
          APP_UNDER_TEST: ${{ matrix.app }}

      # apps.cli_admin and the shared safe_orm service are held at 100%.
      - name: Enforce coverage for cli_admin and safe_orm
        if: ${{ matrix.app == 'cli_admin' }}
        run: |
          .venv/bin/coverage run \
            --source="apps.cli_admin,apps.core.services.db_tools.safe_orm" \
            --omit="*/migrations/*,*/tests/*" \
            manage.py test apps.cli_admin apps.core.tests.services.test_safe_orm
          .venv/bin/coverage xml -o coverage-cli-admin-safe-orm.xml
          .venv/bin/coverage json --pretty-print -o coverage-cli-admin-safe-orm.json
          .venv/bin/python - <<'PY'
          import json
          import os

          with open("coverage-cli-admin-safe-orm.json", encoding="utf-8") as fh:
              totals = json.load(fh)["totals"]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## CLI admin coverage\n\n")
                  fh.write("| Metric | Covered | Total | Percent |\n")
                  fh.write("|---|---:|---:|---:|\n")
                  fh.write(
                      f"| Lines | {totals['covered_lines']} | {totals['num_statements']} | "
                      f"{totals['percent_covered_display']}% |\n"
                  )
          PY
          .venv/bin/coverage report -m --fail-under=100

      - name: Upload CLI admin coverage
        if: ${{ always() && matrix.app == 'cli_admin' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-admin-safe-orm-coverage
          path: |
            src/coverage-cli-admin-safe-orm.xml
            src/coverage-cli-admin-safe-orm.json
          if-no-files-found: warn

      - name: Check Django configuration
        run: .venv/bin/python manage.py check

      - name: Upload backend coverage XML
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-${{ matrix.app }}
          path: |
            src/coverage-${{ matrix.app }}.xml
            src/coverage-${{ matrix.app }}.json
          if-no-files-found: warn

  cli-coverage:
    name: CLI Test and Coverage
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.cli == 'true' }}
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==0.9.26"

      - name: Install locked CLI test dependencies
        run: uv sync --frozen --extra test

      - name: Run CLI tests with branch coverage
        run: |
          uv run pytest \
            --cov=i2g_admin \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage-cli.json \
            --cov-fail-under=0
          uv run python ../scripts/ci/check_coverage_totals.py coverage-cli.json \
            --line-floor "${CLI_COVERAGE_LINES}" \
            --branch-floor "${CLI_COVERAGE_BRANCHES}"

      - name: Upload CLI coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-coverage
          path: cli/coverage-cli.json
          if-no-files-found: warn

  cli-required-result:
    name: CLI Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - cli-coverage
      - changes
    if: ${{ always() }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize CLI checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py --ignore changes
          --passed-message "CLI checks passed or were not required for this run."

  frontend-static:
    name: Frontend Lint, Build and Static Checks
    # ESLint, structure, type check, build, bundle budgets and the npm SBOM in
    # one GitHub-hosted job: each used to be a separate AWS job shorter than its
    # own cold boot. Every check after setup runs even when an earlier one
    # failed, so one run reports all of them.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: pages
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ESLint
        run: npm run lint

      # Layer boundaries, import cycles and directory sizes (ESLint enforces the
      # per-file / per-function hard limits above). See docs/architecture/code-quality.md.
      - name: Check frontend structure
        if: ${{ !cancelled() && steps.frontend-setup.outcome == 'success' }}
        run: npm run check:structure

      # `npm run build` is `tsc -b && vite build`, and tsc -b type-checks both
      # projects referenced by pages/tsconfig.json (tsconfig.app.json and
      # tsconfig.node.json), so this step is also the TypeScript check.
      - name: Type-check and build frontend for CI and E2E
        id: build
        if: ${{ !cancelled() && steps.frontend-setup.outcome == 'success' }}
        run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000

      - name: Upload frontend dist for CI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-ci
          path: pages/dist
          if-no-files-found: error

      - name: Enforce bundle budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run size

      - name: Check built CSS for range-syntax media queries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:built-css

      # vite.config.ts's route-chunk preload table and API preconnect come from
      # the bundle graph, so a Vite/Rolldown upgrade can change them without
      # failing the build. Same URL as the build step above.
      - name: Check built HTML preload table and API preconnect
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:built-html
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000

      - name: Generate npm SBOM
        if: ${{ !cancelled() && steps.frontend-setup.outcome == 'success' }}
        run: npm sbom --sbom-format cyclonedx --json > ../npm-sbom.cdx.json

      - name: Check npm licenses
        if: ${{ !cancelled() && steps.frontend-setup.outcome == 'success' }}
        run: python3 ../scripts/ci/check_npm_licenses.py --package-lock package-lock.json --output ../npm-license-report.json

      - name: Upload frontend supply chain artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-supply-chain-reports
          path: |
            npm-sbom.cdx.json
            npm-license-report.json
          if-no-files-found: warn

  frontend-unit-coverage:
    name: Frontend Unit Test Coverage
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: pages
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Write frontend unit test coverage summary
        if: ${{ always() }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::warning::Frontend coverage summary was not generated."
            exit 0
          fi
          node - <<'NODE'
          const fs = require('node:fs');

          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const rows = [
            ['Statements', summary.statements],
            ['Branches', summary.branches],
            ['Functions', summary.functions],
            ['Lines', summary.lines],
          ];

          const target = process.env.GITHUB_STEP_SUMMARY;
          if (target) {
            const body = [
              '## Frontend Unit Test Coverage',
              '',
              '| Metric | Covered | Total | Coverage |',
              '|:---|---:|---:|---:|',
              ...rows.map(([name, metric]) => `| ${name} | ${metric.covered} | ${metric.total} | ${metric.pct}% |`),
              '',
              'Vitest enforces the coverage thresholds configured in `pages/vitest.config.ts`.',
              '',
            ].join('\n');
            fs.appendFileSync(target, body);
          }
          NODE

      - name: Upload frontend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            pages/coverage/lcov.info
            pages/coverage/coverage-summary.json
          if-no-files-found: warn

  frontend-chromium-smoke:
    name: Required Chromium Smoke
    # Short; the Playwright image pull on a hosted runner costs about one AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Keep the browser and its OS dependencies out of the runner's live APT
    # path. The image version must stay aligned with pages/package-lock.json.
    container:
      image: "mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f"
      options: --user 1001
    needs:
      - frontend-static
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        shell: bash
        working-directory: pages
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CI frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-ci
          path: pages/dist

      - name: Start frontend preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > ../frontend-required-smoke.log 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../frontend-required-smoke.log
          exit 1

      - name: Run required Chromium smoke suite
        env:
          CI: "true"
          PW_PROJECT: required-chromium-smoke
        run: npx playwright test e2e/smoke/required-smoke.spec.ts --project=chromium --workers=1 --retries=0

      - name: Upload required smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-chromium-smoke-diagnostics
          path: |
            frontend-required-smoke.log
            pages/test-results
            pages/blob-report
          if-no-files-found: warn

  frontend-security-audit:
    name: Frontend npm Audit
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Deliberately NOT gated on `changes`. `npm audit` compares the committed
    # lockfile against a live advisory database, so its result is a function of
    # time, not of the diff — the same commit can pass today and fail tomorrow
    # with no code change. Gating it on `frontend` meant a backend-only PR
    # skipped it and then turned main red on merge (blocking the deploy chain,
    # which fires on CI succeeding on main), pinning the failure on an unrelated
    # commit. Runs on every CI invocation instead. Same reasoning as
    # `secrets-scan`, which is likewise ungated.
    needs: preflight
    defaults:
      run:
        working-directory: pages
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate

  frontend-required:
    name: Frontend Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend-static
      - frontend-unit-coverage
      - frontend-chromium-smoke
      - frontend-security-audit
      - changes
    if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize frontend required checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py --ignore changes --skipped-is-failure
          --passed-message "All frontend required checks passed."

  frontend-prod-build:
    name: Frontend Production Build Artifact
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    needs:
      - frontend-required
      - changes
    # Deploy artifact: produced only while deployments are enabled (repository
    # variable DEPLOY_ARTIFACTS_ENABLED, see docs/deployment/ci-cd.md).
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'master') &&
      vars.DEPLOY_ARTIFACTS_ENABLED == 'true' &&
      needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: pages
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production frontend configuration
        env:
          VITE_API_BASE_URL: https://api.i2g.ucmerced.edu
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is required for the production frontend build."
            exit 1
          fi

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build production frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.i2g.ucmerced.edu

      - name: Upload production frontend dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-prod
          path: pages/dist
          if-no-files-found: error

  python-dependency-audit:
    name: Python Dependency Audit and SBOM
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Ungated for the same reason as `frontend-security-audit` above: pip-audit
    # resolves the committed requirements lock against a live advisory feed, so a
    # frontend-only PR that skipped it could still turn main red on merge.
    needs: preflight
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install pip-audit
        run: pip install "pip-audit[cyclonedx]==2.7.3"

      - name: Audit Python dependencies
        run: |
          set -o pipefail
          pip-audit \
            --requirement requirements.txt \
            --progress-spinner off \
            --format columns \
            --ignore-vuln GHSA-mf9w-mj56-hr94 \
            --ignore-vuln GHSA-p998-jp59-783m \
            --ignore-vuln GHSA-hcc4-c3v8-rx92 \
            --ignore-vuln GHSA-m5qp-6w8w-w647 \
            --ignore-vuln GHSA-3wq7-rqq7-wx6j \
            --ignore-vuln GHSA-mwh4-6h8g-pg8w \
            --ignore-vuln GHSA-966j-vmvw-g2g9 \
            --ignore-vuln GHSA-63hf-3vf5-4wqf \
            --ignore-vuln GHSA-c427-h43c-vf67 \
            --ignore-vuln GHSA-w2fm-2cpv-w7v5 \
            --ignore-vuln GHSA-2vrm-gr82-f7m5 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2026-161 \
            | tee "$GITHUB_STEP_SUMMARY"

      # A report, not a gate: pip-audit exits non-zero when it finds a
      # vulnerability, and the audit step above already decided on those.
      - name: Generate Python SBOM
        if: ${{ !cancelled() }}
        run: |
          pip-audit \
            --requirement requirements.txt \
            --progress-spinner off \
            --format cyclonedx-json \
            --output ../python-sbom.cdx.json \
            || true
          test -s ../python-sbom.cdx.json

      - name: Upload Python supply chain artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-supply-chain-report
          path: python-sbom.cdx.json
          if-no-files-found: warn

  semgrep-sast:
    name: Semgrep SAST
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    # Read-only on purpose: `pip install semgrep` pulls ~45 range-resolved
    # dependencies into this job, so it must not hold a token that can change
    # code-scanning alerts. semgrep-sarif-upload below uploads the result.
    outputs:
      scanned: ${{ steps.semgrep.outcome == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Semgrep only needs the files; keep the job token off the disk.
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Semgrep
        run: pip install "semgrep==1.107.0"

      - name: Run Semgrep
        id: semgrep
        env:
          RUN_BACKEND: ${{ needs.changes.outputs.backend }}
          RUN_FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          set -euo pipefail
          targets=()
          if [ "$RUN_BACKEND" = "true" ]; then
            targets+=(src)
          fi
          if [ "$RUN_FRONTEND" = "true" ]; then
            targets+=(pages)
          fi
          # Without --error, findings never change the exit status: only a
          # Semgrep failure does (bad config, registry outage, crash), and that
          # must fail this job instead of passing with an empty or partial SARIF.
          # The gate on findings is the next step.
          semgrep scan --config p/default --config p/python --config p/javascript \
            --metrics=off --sarif --output semgrep.sarif "${targets[@]}"

      # Error-severity findings block; warnings and notes are reported through
      # the Security tab (push runs) and the semgrep-sarif artifact. Suppress a
      # reviewed false positive in place with `# nosemgrep: <rule id>` on the
      # line the finding starts on.
      - name: Fail on error-severity Semgrep findings
        run: |
          python - <<'PY'
          import json
          import sys

          with open("semgrep.sarif", encoding="utf-8") as fh:
              sarif = json.load(fh)

          errors = []
          for run in sarif.get("runs", []):
              levels = {
                  rule["id"]: rule.get("defaultConfiguration", {}).get("level", "warning")
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
              }
              for result in run.get("results", []):
                  if result.get("suppressions"):
                      continue
                  if (result.get("level") or levels.get(result.get("ruleId"), "warning")) != "error":
                      continue
                  location = result["locations"][0]["physicalLocation"]
                  path = location["artifactLocation"]["uri"]
                  line = location["region"]["startLine"]
                  errors.append(f"::error file={path},line={line}::Semgrep {result['ruleId']}")

          print("\n".join(errors) or "No error-severity Semgrep findings.")
          sys.exit(1 if errors else 0)
          PY

      - name: Upload Semgrep SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

  # Push runs only. The only job that holds security-events: write for Semgrep,
  # and it runs no third-party code beyond SHA-pinned actions. Runs whenever the
  # scan itself succeeded, including when its error-severity gate failed: those
  # are the findings the Security tab is for. It only reports, so it is not a
  # need of any required-result job, and a code-scanning API hiccup cannot fail
  # the run.
  semgrep-sarif-upload:
    name: Upload Semgrep SARIF
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [semgrep-sast]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.semgrep-sast.outputs.scanned == 'true' }}
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      # upload-sarif reads the sources to compute result fingerprints.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Semgrep SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: semgrep-sarif

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  backend-docker-build:
    name: Backend Docker Build and Scan
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 25
    needs:
      - lint
      - changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
      security-events: write
    outputs:
      # Whether this run uploaded the image backend-image-publish pushes. The
      # publish job keys off this, not off DEPLOY_ARTIFACTS_ENABLED again, so a
      # variable flipped mid-run cannot make it look for an artifact that was
      # never uploaded.
      image_artifact: ${{ steps.upload-image.outcome == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: src/Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          load: true
          tags: itg-backend-ci:${{ github.sha }}
          cache-from: type=gha
          # Only pushes write the build cache. Entries a pull request or merge
          # group writes are scoped to its own ref, so no other run can read
          # them, and they had pushed the repository past its 10 GB cache limit.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Smoke-test backend Docker runtime
        env:
          IMAGE: itg-backend-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          network="itg-backend-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres="itg-postgres-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backend="itg-backend-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$backend" > backend-docker-smoke.log 2>&1 || true
            docker rm -f "$backend" "$postgres" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network"
          postgres_image="postgres:16"
          for attempt in {1..5}; do
            if docker pull "$postgres_image"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to pull $postgres_image after $attempt attempts." >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "PostgreSQL image pull attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
          docker run -d --name "$postgres" --network "$network" \
            -e POSTGRES_DB=itg_ci \
            -e POSTGRES_USER=itg_ci_user \
            -e POSTGRES_PASSWORD=itg_ci_pass \
            "$postgres_image"

          # A socket pg_isready can pass against the image's init-only server
          # and then fail while it restarts; the script waits on TCP instead.
          bash scripts/ci/wait_for_postgres.sh "$postgres" itg_ci_user itg_ci 60

          # The probes are answered before the request limiter runs; it stays off here (as in the test
          # settings), stated explicitly so the smoke never depends on that default.
          docker run -d --name "$backend" --network "$network" -p 127.0.0.1:8000:8000 \
            -e DJANGO_SETTINGS_MODULE=config.settings.environments.test \
            -e DB_NAME=itg_ci \
            -e DB_USER=itg_ci_user \
            -e DB_PASSWORD=itg_ci_pass \
            -e DB_HOST="$postgres" \
            -e DB_PORT=5432 \
            -e RUN_DATABASE_MIGRATIONS=true \
            -e WEB_CONCURRENCY=1 \
            -e REQUEST_RATE_LIMITS_ENABLED=false \
            "$IMAGE"

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/livez/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/readyz/ >/dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$backend")" != "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs "$backend"
            exit 1
          fi
          curl --fail --show-error http://127.0.0.1:8000/livez/
          curl --fail --show-error http://127.0.0.1:8000/readyz/

      - name: Upload backend runtime smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-docker-smoke-logs
          path: backend-docker-smoke.log
          if-no-files-found: warn

      # Persist Trivy's vulnerability DB across runs so the scan below doesn't
      # re-pull it from the registry on every CI run. Both Trivy steps point at
      # this dir via TRIVY_CACHE_DIR. The key changes once a day: a per-run key
      # never hit exactly, so every run saved another ~90 MB entry and pushed
      # the repository past its 10 GB Actions cache limit, evicting the venv
      # and npm caches. Trivy still refreshes a stale DB itself.
      - name: Pick the Trivy database cache key
        id: trivy-cache-date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ steps.trivy-cache-date.outputs.today }}
          restore-keys: |
            trivy-db-

      - name: Scan image (Trivy CRITICAL/HIGH)
        id: trivy-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        with:
          image-ref: itg-backend-ci:${{ github.sha }}
          # The action's binary cache contains absolute hosted-runner paths.
          # Install locally; the vulnerability database is cached above.
          cache: false
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn

      # Push-only (no PR-side equivalent), so a code-scanning API hiccup must not
      # be able to fail backend-docker-build -> backend-required-result ->
      # CI Result with zero pre-merge signal. The findings are already archived
      # as the trivy-sarif artifact in the step above. Runs whenever the scan
      # ran: with exit-code 1 a scan that finds something reports `failure`,
      # and those are exactly the results the Security tab must show.
      - name: Upload Trivy SARIF to GitHub Security tab
        if: ${{ always() && github.event_name == 'push' && steps.trivy-sarif.outcome != 'skipped' && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-backend-image

      # Only re-render the human-readable table when something failed. On the
      # happy path the SARIF artifact above already captures every finding, so
      # skipping this avoids a second full image scan. The cached DB above keeps
      # this fast when it does run.
      - name: Trivy human-readable table
        if: ${{ failure() && steps.trivy-sarif.outcome == 'failure' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        with:
          image-ref: itg-backend-ci:${{ github.sha }}
          cache: false
          skip-setup-trivy: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Feeds backend-image-publish; skipped with it while deployments are paused.
      - name: Export tested and scanned backend image
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && vars.DEPLOY_ARTIFACTS_ENABLED == 'true' }}
        run: docker save --output /tmp/backend-image.tar "itg-backend-ci:${{ github.sha }}"
      - name: Upload tested and scanned backend image
        id: upload-image
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && vars.DEPLOY_ARTIFACTS_ENABLED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-scanned-image
          path: /tmp/backend-image.tar
          compression-level: 0
          retention-days: 2

  backend-required-result:
    name: Backend Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - backend-checks
      - django-test-coverage
      - backend-docker-build
      - changes
    if: ${{ always() && needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize backend required checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py --ignore changes
          --passed-message "All backend required checks passed."

  backend-image-publish:
    name: Backend Image Publish
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 25
    needs: [backend-required-result, backend-docker-build, changes]
    # Pushes itg-backend:<sha> for deploy-backend.yml. Off while deployments are
    # paused (repository variable DEPLOY_ARTIFACTS_ENABLED, see
    # docs/deployment/ci-cd.md): runs only when backend-docker-build uploaded
    # the image in this same run. deploy-artifact-result passes when skipped.
    if: >-
      github.event_name == 'push' && github.ref_name == 'main' &&
      needs.backend-docker-build.outputs.image_artifact == 'true' &&
      needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
      ECR_REPOSITORY: itg-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up publisher Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}
      - name: Download tested and scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-scanned-image
          path: /tmp/backend-image
      - name: Load tested image
        run: docker load --input /tmp/backend-image/backend-image.tar
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::394167325273:role/itg-ci-image-publisher
          allowed-account-ids: "394167325273"
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Publish tested image once
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          python scripts/deploy/publish_image.py --repository "$ECR_REPOSITORY" \
            --registry "$REGISTRY" --tag "$GITHUB_SHA" --source "itg-backend-ci:$GITHUB_SHA"

  security-required-result:
    name: Security Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - secrets-scan
      - python-dependency-audit
      - frontend-security-audit
      - semgrep-sast
      - changes
    if: ${{ always() }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize security checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py --ignore changes
          --passed-message "All security checks passed."

  deploy-artifact-result:
    name: Deploy Artifact Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-image-publish
      - frontend-prod-build
      - changes
    if: ${{ always() }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize deploy artifact checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py --ignore changes
          --passed-message "Deploy artifacts passed or were not required for this run."

  e2e:
    name: E2E (${{ matrix.project }})
    # Pinned to the container's Ubuntu release: setup-python takes the backend
    # Python from the host's tool cache (/__t), and since ubuntu-latest became
    # ubuntu-26.04 (2026-10-29) that build needs OpenSSL >= 3.3, which the
    # noble image below does not have, so `import ssl` failed in every leg.
    # Move this together with the Playwright image's Ubuntu release.
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    # The image already contains the browsers and Linux packages required by
    # this Playwright version. Keeping E2E off the runner's live APT path avoids
    # correlated mirror stalls across the ten parallel matrix legs.
    container:
      image: "mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f"
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    strategy:
      # Never fail fast: one red device must not cancel the other nine, so every
      # leg produces its own `E2E (<project>)` check run and blob report. Per-
      # device detail lives in those checks and in the merged report from
      # `e2e-report`; `e2e-required-result` only rolls the matrix up into a
      # pass/fail gate (`needs` is keyed by job id, so it sees a single `e2e`
      # entry, never the individual legs).
      fail-fast: false
      matrix:
        # All 10 projects in pages/playwright.config.ts on every event
        # (PR/push parity); MatrixParityTests keeps the two lists equal.
        project:
          - chromium
          - firefox
          - webkit
          - pixel7
          - iphone14
          - iphone-se
          - ipad
          - iphone-17-pro-max
          - galaxy-s26-ultra
          - galaxy-tab-s9
    needs:
      # The ten AWS machines boot only for a tree that lints, type-checks and
      # builds. Unit coverage, the Chromium smoke test and npm audit still gate
      # CI Result through frontend-required, but E2E no longer waits for them.
      # backend-docker-build is omitted too: e2e runs the app via
      # `manage.py runserver`, never the built image.
      - frontend-static
      - secrets-scan
      - changes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itg_ci
          POSTGRES_USER: itg_ci_user
          POSTGRES_PASSWORD: itg_ci_pass
        # Probe TCP: the image's init-only first-start server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U itg_ci_user -d itg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: itg_ci
      DB_USER: itg_ci_user
      DB_PASSWORD: itg_ci_pass
      # Service containers share a Docker network with the E2E job container.
      DB_HOST: postgres
      DB_PORT: 5432
      VITE_API_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8000
      ADMIN_REQUIRE_CONFIRMATION: "true"
      # One browser and one IP drive every spec: the request limiter stays off here (the test settings' default,
      # stated so a settings change cannot switch it on unnoticed); its own tests switch it on.
      REQUEST_RATE_LIMITS_ENABLED: "false"
      PW_PROJECT: ${{ matrix.project }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The job container's filesystem differs from the host runner's, so its
      # venv gets its own cache key (cache-label names the image release).
      - name: Set up backend virtualenv
        uses: ./.github/actions/setup-backend-venv
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}
          coverage-version: ${{ env.COVERAGE_VERSION }}
          cache-label: pw-v1.64.0-noble

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CI frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-ci
          path: pages/dist

      - name: Prepare backend database
        working-directory: src
        run: .venv/bin/python manage.py migrate --noinput

      - name: Seed admin E2E data
        working-directory: src
        run: .venv/bin/python manage.py seed_admin_e2e --yes

      - name: Start backend
        working-directory: src
        run: |
          # --insecure forces django.contrib.staticfiles to serve admin/Unfold
          # assets (Alpine, the theme runtime, CSS) via finders even though the
          # CI test settings run with DEBUG=False. Without it every /static/
          # request 404s, so admin JS never executes and the theme E2E fails.
          .venv/bin/python manage.py runserver --insecure 127.0.0.1:8000 > ../backend-e2e.log 2>&1 &
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1

      - name: Start frontend preview
        working-directory: pages
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > ../frontend-e2e.log 2>&1 &
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../frontend-e2e.log
          exit 1

      - name: Run Playwright tests
        working-directory: pages
        run: npx playwright test --project="$PW_PROJECT"

      - name: Upload blob report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.project }}
          path: pages/blob-report/
          if-no-files-found: warn

      - name: Upload server logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.project }}
          path: |
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: warn

  e2e-report:
    name: E2E Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: write
    needs: [e2e, changes]
    if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download and validate blob reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/download_playwright_blobs.sh

      - name: Merge blob reports into HTML + JUnit + GitHub annotations
        working-directory: pages
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
        run: |
          set -euo pipefail
          if [ ! -d ./all-blob-reports ] || [ -z "$(ls -A ./all-blob-reports 2>/dev/null)" ]; then
            echo "::notice::No blob reports to merge; skipping report generation."
            exit 0
          fi
          npx playwright merge-reports --reporter html,github,junit ./all-blob-reports

      - name: Write end-to-end test summary
        if: ${{ always() }}
        working-directory: pages
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          dur = 0.0
          for f in sorted(glob.glob('results*.xml')):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              suites = [root] if root.tag == 'testsuite' else root.iter('testsuite')
              for s in suites:
                  total += int(s.get('tests', 0))
                  fail += int(s.get('failures', 0))
                  err += int(s.get('errors', 0))
                  skip += int(s.get('skipped', 0))
                  dur += float(s.get('time', 0) or 0)
          passed = total - fail - err - skip
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as fh:
                  fh.write('## Playwright End-to-End Test Results\n\n')
                  fh.write('| Total Tests | Passed | Failed | Skipped | Duration |\n')
                  fh.write('|---:|---:|---:|---:|---:|\n')
                  fh.write(f'| {total} | {passed} | {fail + err} | {skip} | {dur:.1f}s |\n')
          PY

      - name: Annotate test results on the PR
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        with:
          report_paths: pages/results.xml
          detailed_summary: true
          # This action uses status emoji in its generated job summary. Keep its
          # annotations, but use the controlled professional summary above.
          job_summary: false
          include_passed: false
          fail_on_failure: false

      - name: Upload merged HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-html-report
          path: |
            pages/playwright-report
            pages/test-results
          if-no-files-found: warn

  # Gates `CI Result`. Depends on `e2e` directly rather than on `e2e-report`, so
  # a flaky blob-report download/merge (that job is `continue-on-error`) can
  # never block a merge — only a genuinely failing device leg can.
  #
  # This job only runs when `changes.frontend == 'true'`, and `e2e` gates on
  # exactly that condition, so `e2e` cannot be legitimately skipped here: a
  # "skipped" result means an upstream job (frontend-static, secrets-scan)
  # failed and cascaded, and the device matrix never ran. Reporting that as a
  # pass is how a required check went green with zero E2E coverage behind it
  # (PR #439), so "skipped" is a FAILURE for this gate specifically.
  e2e-required-result:
    name: E2E Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - e2e
      - changes
    if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize E2E checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py --ignore changes --skipped-is-failure
          --passed-message "All E2E legs passed."

  archive-tests:
    name: Archive Static Site Tests
    # Short and not CPU-bound: a GitHub-hosted runner starts it faster than an AWS cold boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.archive == 'true' }}
    defaults:
      run:
        working-directory: archive/page
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the static-site smoke suite
        run: python -m pytest tests

  archive-required-result:
    name: Archive Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - archive-tests
      - changes
    if: ${{ always() }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize archive checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py --ignore changes
          --passed-message "Archive checks passed or were not required for this run."

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - changes
      - backend-required-result
      - frontend-required
      - e2e-required-result
      - security-required-result
      - deploy-artifact-result
      - archive-required-result
      - cli-required-result
    if: ${{ always() }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Summarize required jobs
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: >-
          python scripts/ci/check_required_results.py
          --passed-message "All required CI jobs passed."

  ci-timing-report:
    name: CI Timing Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-result]
    if: ${{ always() }}
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch current workflow jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > workflow-jobs.json

      - name: Write CI timing summary
        run: python scripts/ci/summarize_workflow_jobs.py < workflow-jobs.json >> "$GITHUB_STEP_SUMMARY"
