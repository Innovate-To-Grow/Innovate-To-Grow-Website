  e2e-plan:
    name: Plan E2E Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      spec_args: ${{ steps.plan.outputs.spec_args }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # PR/push parity: plan_e2e_tests.py returns the full device matrix with no
      # spec filter for every event, so there is no diff to compute (and no need
      # for the full-history clone this step used to require). PRs used to run
      # chromium-only with a diff-derived spec subset, which is what hid the
      # iphone14 + ipad failure until after the merge (run 32107167026).
      - name: Capture changed files
        run: ': > changed-files.txt'

      - name: Select browser/device/spec coverage
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/ci/plan_e2e_tests.py \
            --event-name "$EVENT_NAME" \
            --changed-files changed-files.txt \
            >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.project }})
    # Pinned to the container's Ubuntu release: setup-python takes the backend
    # Python from the host's tool cache (/__t), and since ubuntu-latest became
    # ubuntu-26.04 (2026-10-29) that build needs OpenSSL >= 3.3, which the
    # noble image below does not have, so `import ssl` failed in every leg.
    # Move this together with the Playwright image's Ubuntu release.
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    # The image already contains the browsers and Linux packages required by
    # this Playwright version. Keeping E2E off the runner's live APT path avoids
    # correlated mirror stalls across the ten parallel matrix legs.
    container:
      image: "mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f"
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    strategy:
      # Never fail fast: one red device must not cancel the other nine, so every
      # leg produces its own `E2E (<project>)` check run and blob report. Per-
      # device detail lives in those checks and in the merged report from
      # `e2e-report`; `e2e-required-result` only rolls the matrix up into a
      # pass/fail gate (`needs` is keyed by job id, so it sees a single `e2e`
      # entry, never the individual legs).
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.e2e-plan.outputs.matrix) }}
    needs:
      # backend-docker-build intentionally omitted: e2e runs the app via
      # `manage.py runserver`, never the built image, so depending on it only
      # serialized e2e behind the slowest job without adding coverage.
      - e2e-plan
      - frontend-required
      - secrets-scan
      - changes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itg_ci
          POSTGRES_USER: itg_ci_user
          POSTGRES_PASSWORD: itg_ci_pass
        # Probe TCP: the image's init-only first-start server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U itg_ci_user -d itg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: itg_ci
      DB_USER: itg_ci_user
      DB_PASSWORD: itg_ci_pass
      # Service containers share a Docker network with the E2E job container.
      DB_HOST: postgres
      DB_PORT: 5432
      VITE_API_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8000
      ADMIN_REQUIRE_CONFIRMATION: "true"
      PW_PROJECT: ${{ matrix.project }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}

      - name: Cache backend virtualenv
        id: backend-venv-cache
        uses: actions/cache@v6
        with:
          path: src/.venv
          # Do not restore a host-runner venv inside the job container: scripts
          # and interpreter links can contain environment-specific paths.
          key: backend-venv-${{ runner.environment }}-pw-v1.64.0-noble-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-coverage${{ env.COVERAGE_VERSION }}-${{ hashFiles('src/requirements*.txt', 'src/requirements/**/*.txt') }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Validate cached virtualenv
        id: backend-venv-check
        working-directory: src
        run: |
          # A cached venv hard-codes the interpreter it was built against. If
          # that interpreter is gone (a hosted-runner Python patch bump) or the
          # archive is partial, every `.venv/bin/...` call dies with exit 127
          # instead of falling back to a reinstall. A venv can also start but be
          # unable to import what the backend needs: on 2026-10-29 restored E2E
          # venvs failed `import ssl`, so urllib3/botocore broke at Django start-up.
          # Probe those imports, and discard the venv when they fail so the install
          # step below rebuilds it.
          if probe=$(.venv/bin/python -c "import ssl, django, botocore.httpsession" 2>&1); then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cached virtualenv is unusable (${probe##*$'\n'}); rebuilding."
            rm -rf .venv
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install backend dependencies
        if: ${{ steps.backend-venv-check.outputs.usable != 'true' }}
        working-directory: src
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt "coverage[toml]==${COVERAGE_VERSION}"

      - name: Install frontend dependencies
        working-directory: pages
        run: npm ci

      - name: Download CI frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-ci
          path: pages/dist

      - name: Prepare backend database
        working-directory: src
        run: .venv/bin/python manage.py migrate --noinput

      - name: Seed admin E2E data
        working-directory: src
        run: .venv/bin/python manage.py seed_admin_e2e --yes

      - name: Start backend
        working-directory: src
        run: |
          # --insecure forces django.contrib.staticfiles to serve admin/Unfold
          # assets (Alpine, the theme runtime, CSS) via finders even though the
          # CI test settings run with DEBUG=False. Without it every /static/
          # request 404s, so admin JS never executes and the theme E2E fails.
          .venv/bin/python manage.py runserver --insecure 127.0.0.1:8000 > ../backend-e2e.log 2>&1 &
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1

      - name: Start frontend preview
        working-directory: pages
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > ../frontend-e2e.log 2>&1 &
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../frontend-e2e.log
          exit 1

      - name: Run Playwright tests
        working-directory: pages
        env:
          PLAYWRIGHT_SPEC_ARGS: ${{ matrix.spec_args }}
        run: |
          args=()
          if [ -n "$PLAYWRIGHT_SPEC_ARGS" ]; then
            read -r -a args <<< "$PLAYWRIGHT_SPEC_ARGS"
          fi
          npx playwright test "${args[@]}" --project="$PW_PROJECT"

      - name: Upload blob report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.project }}
          path: pages/blob-report/
          if-no-files-found: warn

      - name: Upload server logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.project }}
          path: |
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: warn

  e2e-report:
    name: E2E Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: write
    needs: [e2e, changes]
    if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install frontend dependencies
        working-directory: pages
        run: npm ci

      - name: Download and validate blob reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/download_playwright_blobs.sh

      - name: Merge blob reports into HTML + JUnit + GitHub annotations
        working-directory: pages
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
        run: |
          set -euo pipefail
          if [ ! -d ./all-blob-reports ] || [ -z "$(ls -A ./all-blob-reports 2>/dev/null)" ]; then
            echo "::notice::No blob reports to merge; skipping report generation."
            exit 0
          fi
          npx playwright merge-reports --reporter html,github,junit ./all-blob-reports

      - name: Write end-to-end test summary
        if: ${{ always() }}
        working-directory: pages
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          dur = 0.0
          for f in sorted(glob.glob('results*.xml')):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              suites = [root] if root.tag == 'testsuite' else root.iter('testsuite')
              for s in suites:
                  total += int(s.get('tests', 0))
                  fail += int(s.get('failures', 0))
                  err += int(s.get('errors', 0))
                  skip += int(s.get('skipped', 0))
                  dur += float(s.get('time', 0) or 0)
          passed = total - fail - err - skip
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as fh:
                  fh.write('## Playwright End-to-End Test Results\n\n')
                  fh.write('| Total Tests | Passed | Failed | Skipped | Duration |\n')
                  fh.write('|---:|---:|---:|---:|---:|\n')
                  fh.write(f'| {total} | {passed} | {fail + err} | {skip} | {dur:.1f}s |\n')
          PY

      - name: Annotate test results on the PR
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        with:
          report_paths: pages/results.xml
          detailed_summary: true
          # This action uses status emoji in its generated job summary. Keep its
          # annotations, but use the controlled professional summary above.
          job_summary: false
          include_passed: false
          fail_on_failure: false

      - name: Upload merged HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: |
            pages/playwright-report
            pages/test-results
          if-no-files-found: warn

  # Gates `CI Result`. Depends on `e2e` directly rather than on `e2e-report`, so
  # a flaky blob-report download/merge (that job is `continue-on-error`) can
  # never block a merge — only a genuinely failing device leg can.
  e2e-required-result:
    name: E2E Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - e2e-plan
      - e2e
      - changes
    if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Summarize E2E checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          # This job only runs when `changes.frontend == 'true'`, and both
          # `e2e-plan` and `e2e` gate on exactly that same condition. So neither
          # can be legitimately path-filtered here: a "skipped" result means an
          # upstream job (frontend-required, secrets-scan) failed and cascaded,
          # and the device matrix never ran. Reporting that as a pass is how a
          # required check goes green with zero E2E coverage behind it, so
          # "skipped" is a FAILURE for this gate specifically.
          ok = {"success"}
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if name != "changes" and data["result"] not in ok
          }
          if failed:
              for name, result in failed.items():
                  detail = " (upstream failure cascaded; E2E never ran)" if result == "skipped" else ""
                  print(f"{name}: {result}{detail}")
              sys.exit(1)
          print("All E2E legs passed.")
          PY

  archive-tests:
    name: Archive Static Site Tests
    runs-on: ${{ fromJSON(vars.AWS_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "i2g-aws"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.archive == 'true' }}
    defaults:
      run:
        working-directory: archive/page
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the static-site smoke suite
        run: python -m pytest tests

  archive-required-result:
    name: Archive Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - archive-tests
      - changes
    if: ${{ always() }}
    steps:
      - name: Summarize archive checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          ok = {"success", "skipped"}
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if name != "changes" and data["result"] not in ok
          }
          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)
          print("Archive checks passed or were not required for this run.")
          PY

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - changes
      - backend-required-result
      - frontend-required
      - e2e-required-result
      - security-required-result
      - supply-chain-result
      - deploy-artifact-result
      - archive-required-result
      - cli-required-result
    if: ${{ always() }}
    steps:
      - name: Summarize required jobs
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          # Path-filtered jobs that don't apply to this change report "skipped";
          # that is a pass, not a failure. Only real failures/cancellations block.
          ok = {"success", "skipped"}
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] not in ok
          }
          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)
          print("All required CI jobs passed.")
          PY

  ci-timing-report:
    name: CI Timing Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-result]
    if: ${{ always() }}
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch current workflow jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > workflow-jobs.json

      - name: Write CI timing summary
        run: python scripts/ci/summarize_workflow_jobs.py < workflow-jobs.json >> "$GITHUB_STEP_SUMMARY"
