<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/i2glogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <title>Innovate to Grow | School of Engineering</title>
    <!-- Site-wide description and link-preview tags. Link unfurlers (Slack, Teams, social sites) do not
         run scripts, so a shared link shows these; for search engines the app keeps the description,
         canonical URL, robots and og:title / og:url in step with each route (src/hooks/documentHead.ts). -->
    <meta name="description" content="Innovate to Grow is UC Merced School of Engineering's experiential learning program: student teams design systems that solve real-world problems for partner organizations." />
    <meta property="og:site_name" content="Innovate to Grow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Innovate to Grow | UC Merced School of Engineering" />
    <meta property="og:description" content="Innovate to Grow is UC Merced School of Engineering's experiential learning program: student teams design systems that solve real-world problems for partner organizations." />
    <meta name="twitter:card" content="summary" />

    <!-- Critical CSS: paints an init loader the moment HTML parses, so first
         paint is never blank. It uses #root:empty::before (the ring) and ::after
         (the "Loading…" label) and disappears the instant React mounts content
         into #root. It draws the shared LoadingIndicator
         (src/components/LoadingIndicator: a 24px ring, 3px border colour with a
         primary top, 0.8s a turn, beside the label) in the place where the
         lazy-route fallback shows it next, so nothing moves when that takes
         over: the page shell's 16px top padding, then centred in the
         fallback's 50vh box (Container.css .app-layout and .page-loader). -->
    <style>
      /* Cascade layer order (src/styles/layers.css); this statement comes first so it fixes the order. */
      @layer itg.defaults, itg.tokens, itg.base, itg.components, itg.overrides, itg.page;

      /* First-paint defaults: in the lowest layer, so the bundle's own html/body rules win. */
      @layer itg.defaults {
        html { background: #fff; }
        body { font-family: "Open Sans", "Segoe UI", Arial, sans-serif; margin: 0; }

        /* ---- init loader ---- */
        @keyframes itg-init-loader-spin { to { transform: rotate(360deg); } }
        @keyframes itg-init-loader-fade-in { from { opacity: 0; } to { opacity: 1; } }
        #root:empty::before {
          content: "";
          flex: none;
          box-sizing: border-box;
          width: 24px;
          height: 24px;
          margin-top: calc(16px + (50vh - 24px) / 2);
          border: 3px solid var(--itg-color-border, #dddddd);
          border-top-color: var(--itg-color-primary, #0f2d52);
          border-radius: 50%;
          animation:
            itg-init-loader-spin 0.8s linear infinite,
            itg-init-loader-fade-in 0.25s ease-out;
        }
        /* The label: LoadingIndicator's 0.75rem gap and its secondary 16px / 24px text. */
        #root:empty::after {
          content: "Loading\2026";
          margin-top: calc(16px + (50vh - 24px) / 2);
          margin-left: 0.75rem;
          color: var(--itg-color-text-secondary);
          font-size: var(--itg-font-size-body, 1rem);
          line-height: 24px;
          animation: itg-init-loader-fade-in 0.25s ease-out;
        }
        @media (prefers-reduced-motion: reduce) {
          #root:empty::before {
            animation: itg-init-loader-fade-in 0.25s ease-out;
            opacity: 0.7;
          }
        }
        /* Forced colours would paint the whole ring one colour: GrayText with a CanvasText top, as LoadingIndicator. */
        @media (forced-colors: active) {
          #root:empty::before {
            forced-color-adjust: none;
            border-color: GrayText;
            border-top-color: CanvasText;
          }
        }
      }

      /* The init loader's ring and label side by side, centred like the fallback's. Unlayered, so it wins over
         the bundle's own #root rules (a column); it stops matching as soon as React mounts into #root. */
      #root:empty {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }

      /* Block preview iframe: strip all page chrome so only the block content renders. These rules
         stay unlayered, so they win over every layer of the bundle. */
      html[data-block-preview] { background: transparent; }
      html[data-block-preview] body { background: transparent; }
      html[data-block-preview] #root,
      html[data-block-preview] .main-content,
      html[data-block-preview] .mc-content { min-height: 0; display: block; }
      html[data-block-preview] #main,
      html[data-block-preview] .container,
      html[data-block-preview] #main-content,
      html[data-block-preview] #content,
      html[data-block-preview] #content-wrapper,
      html[data-block-preview] .app-layout { padding: 0; margin: 0; max-width: none; width: auto; }
      html[data-block-preview] #root:empty::before,
      html[data-block-preview] #root:empty::after { display: none; }
      html[data-block-preview] .userway_buttons_wrapper { display: none !important; }
      /* Isolated routes mount no header or footer: their roots take no space,
         whatever the site stylesheets reserve for them. */
      html[data-block-preview] #menu-root,
      html[data-block-preview] #footer-root { display: none; }
      /* The wrappers above are plain blocks here, so the first heading's top margin would
         collapse up through them and push the whole page down; keep it inside #main. */
      html[data-block-preview] #main { display: flow-root; }
    </style>
    <!-- Site Settings design tokens and custom CSS (layers itg.tokens and itg.overrides).
         Render-blocking so the tokens resolve before the first styled paint; the inline
         spinner above covers the window before it. -->
    <link rel="stylesheet" href="/api/layout/theme.css">
    <!-- UC Merced subsite typefaces: Open Sans (text) and Khula (site name). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khula:wght@300;600&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap">
  </head>
  <body class="html front not-logged-in no-sidebars page-node">
    <!-- NAVBAR -->
    <div id="menu-root"></div>
    <!-- END NAVBAR -->

    <!-- The page's one main landmark (a native element, so page-level <header>s
         inside it are not exposed as nested banners). The skip link targets #main. -->
    <main id="main" class="clearfix main">
        <div class="container">
            <div id="main-content" class="row main-content">
                <div id="content" class="mc-content span12">
                    <div id="content-wrapper" class="content-wrapper">
                        <!-- React Root -->
                        <div id="root"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER: rendered dynamically by React -->
    <div id="footer-root"></div>
    <!-- END FOOTER -->

    <!-- CHATBOT: public floating AI assistant widget, rendered by React -->
    <div id="chatbot-root"></div>
    <!-- END CHATBOT -->

    <noscript>Please ensure Javascript is enabled for purposes of <a href="https://userway.org">website accessibility</a></noscript>

    <!-- React App Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
