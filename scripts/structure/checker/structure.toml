# Repository structure rules for `python -m scripts.structure.checker` (architecture spec R001-R005, R024, R032).
# Policy and how to add an entry: docs/architecture/code-quality.md ("Repository structure").
#
# Patterns are repository-relative POSIX globs: `*` stays inside one path segment, `**/` spans any number of
# segments, and `.` is the repository root. Every entry needs a `reason`. An entry that no longer matches
# anything is reported as stale (and fails in enforce mode), so these lists only shrink.

[limits]
file_lines = 200        # R001: physical lines, blank and comment lines included
directory_files = 8     # R002: files directly in one directory (entry files below excluded)
directory_subdirs = 8   # R003: subdirectories directly in one directory
module_depth = 6        # R004: levels from a business-module root to a file (advisory)

[measure]
# R001 measures hand-maintained source code. Docs and data (.md .json .toml .txt), images and fonts are not
# measured for length; they still count as files for R002 and R003.
source_extensions = [".py", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".css", ".scss", ".html", ".sh", ".tf", ".yml", ".yaml"]
source_names = ["Dockerfile"]
# Package entry files never count toward R002/R003: Python package init files (R005) and a frontend feature's
# public entry point, the only import surface other features may use (R008, pages/scripts/check-structure.mjs).
entry_files = ["**/__init__.py", "pages/src/features/*/index.ts"]
# Business-module roots for R004 depth; the deepest matching directory above a file is its module root.
module_roots = [
    "src/apps/*",
    "src/config",
    "pages/src/*",
    "pages/src/features/*",
    "pages/src/routes/*",
    "pages/src/__tests__/*",
    "pages/src/__tests__/features/*",
    "pages/src/__tests__/routes/*",
    "pages/e2e",
    "cli/src/i2g_admin",
    "cli/tests",
    "archive/page",
    "scripts/*",
]
banned_directory_names = ["misc", "others", "other", "temp", "tmp"]

# ---------------------------------------------------------------------------------------------------------------
# Unmeasured (R005): invisible to every rule — migrations, third-party code, generated and historical files.
# ---------------------------------------------------------------------------------------------------------------

[[unmeasured]]
paths = ["src/apps/*/migrations/**"]
reason = "R024/R026: Django migrations are read-only history; their directories stay as they are whatever their size."

[[unmeasured]]
paths = ["src/assets/vendor/**"]
reason = "Third-party libraries served by the admin (altcha, CodeMirror, Font Awesome, html5-qrcode, js-beautify)."

[[unmeasured]]
paths = ["archive/legacy/**"]
reason = "Historical material of the retired site (webpages.zip), kept for reference only."

[[unmeasured]]
paths = [
    "archive/page/static/css/date-module.css",
    "archive/page/static/css/drupal-core.css",
    "archive/page/static/css/jquery-ui.css",
    "archive/page/static/css/jquery-ui-timepicker.css",
    "archive/page/static/css/theme-open-framework.css",
    "archive/page/static/js/colorbox.js",
    "archive/page/static/js/drupal-core.js",
    "archive/page/static/js/jquery-ui.js",
    "archive/page/static/js/siteimprove.js",
    "archive/page/static/js/theme-open-framework.js",
]
reason = "Third-party assets of the archived Drupal site: Drupal core and Date module, jQuery 1.7.2, jQuery UI 1.10.2, Colorbox 1.6.4, the Open Framework theme and the Siteimprove snippet."

[[unmeasured]]
paths = ["pages/package-lock.json", "cli/uv.lock", ".bandit-baseline.json", "aws/ci-runners/.terraform.lock.hcl"]
reason = "Generated by npm, uv, bandit and terraform."

# ---------------------------------------------------------------------------------------------------------------
# Directories whose layout a framework or tool fixes (R005). Only the named rules are relaxed, only for these
# directories; the files inside are still measured and subdirectories are measured normally.
# ---------------------------------------------------------------------------------------------------------------

[[exceptions]]
paths = ["."]
rules = ["R003-mixed"]
reason = "Repository root: git, pre-commit, Ruff/Bandit (pyproject.toml) and gitleaks read their files here."

[[exceptions]]
paths = [".github"]
rules = ["R003-mixed"]
reason = "GitHub reads dependabot.yml, actionlint.yaml, actions/ and workflows/ from this directory."

[[exceptions]]
paths = [".github/workflows"]
rules = ["R002"]
reason = "GitHub Actions loads workflows only from this flat directory."

[[exceptions]]
paths = ["src"]
rules = ["R003-mixed"]
reason = "Django project root and backend Docker build context (manage.py, Dockerfile, .dockerignore, requirements.txt)."

[[exceptions]]
paths = ["src/apps"]
rules = ["R003-width"]
reason = "One directory per Django app; moving an app changes AppConfig.name and the import paths migrations and the legacy-import shim depend on (R017, R025)."

[[exceptions]]
paths = ["src/apps/*"]
rules = ["R003-mixed", "R003-width"]
reason = "Django app roots: apps.py, models, admin, migrations, management, templates, static and tests are names Django looks up (R005)."

[[exceptions]]
paths = ["src/apps/*/management/commands"]
rules = ["R002"]
reason = "Django discovers management commands only as modules directly in this directory."

[[exceptions]]
paths = ["src/docker/security/debian"]
rules = ["R002"]
reason = "Debian security floor files are installed as one flat set by install-debian-floors.sh during the image build; one package per file is enforced by test_debian_security_floors."

[[exceptions]]
paths = ["pages"]
rules = ["R002", "R003-mixed"]
reason = "Frontend project root: npm, Vite, TypeScript, ESLint, Vitest and Playwright read their configs here."

[[exceptions]]
paths = ["pages/src"]
rules = ["R003-mixed", "R003-width"]
reason = "Vite source root: main.tsx (the entry index.html loads), the global index.css, and the layer directories check-structure.mjs enforces."

[[exceptions]]
paths = ["pages/public", "pages/public/**"]
rules = ["R002", "R003-mixed"]
reason = "Served at fixed public URLs (/robots.txt, /assets/...); CMS content stored in the database may link them."

[[exceptions]]
paths = ["cli"]
rules = ["R003-mixed"]
reason = "Python project root of the i2g-admin CLI (pyproject.toml, uv.lock, README)."

[[exceptions]]
paths = ["archive/page"]
rules = ["R003-mixed"]
reason = "Flask app root and archive Docker build context (app.py, Dockerfile, requirements.txt)."

[[exceptions]]
paths = ["aws/ci-runners"]
rules = ["R002", "R003-mixed"]
reason = "One Terraform root module: Terraform loads every *.tf in the directory, and moving resources into child modules changes their state addresses (an infrastructure change)."

# ---------------------------------------------------------------------------------------------------------------
# R001 file-length exceptions.
# ---------------------------------------------------------------------------------------------------------------

[[exceptions]]
paths = [".github/workflows/ci.yml", ".github/workflows/deploy-backend.yml", ".github/workflows/deploy-archive.yml"]
rules = ["R001"]
reason = "Splitting into reusable workflows renames the jobs and checks the CI Result ruleset, the deploy workflow_run trigger and test_ci_workflow_invariants.py depend on (spec priority 2: deploy behavior)."

[[exceptions]]
paths = ["aws/legacy/template.yaml"]
rules = ["R001"]
reason = "CloudFormation template of the legacy stack; splitting it needs nested stacks, an infrastructure change."

[[exceptions]]
paths = ["archive/page/templates/events/*.html", "archive/page/static/css/events/*.css", "archive/page/static/js/events/*.js"]
rules = ["R001"]
reason = "Frozen conversions of past event pages from the legacy Drupal site (#204), kept pixel-identical: content snapshots, not maintained application code."

# ---------------------------------------------------------------------------------------------------------------
# Migration guard (R024). Enforced in CI: an existing file under a protected path may not be modified, deleted,
# renamed or change type; added files pass. List a change in `allowed_changes` (as
# `{ paths = ["..."], reason = "..." }`) only when the owners explicitly approved it.
# ---------------------------------------------------------------------------------------------------------------

[migrations]
protected = ["**/migrations/**"]
allowed_changes = []
