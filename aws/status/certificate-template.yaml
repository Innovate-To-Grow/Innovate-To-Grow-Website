AWSTemplateFormatVersion: "2010-09-09"
Description: ACM certificate for the I2G CloudFront status domain (deploy in us-east-1 only).

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route53 hosted zone containing the status domain.
  StatusDomainName:
    Type: String
    Default: status.i2g.ucmerced.edu
    AllowedPattern: ^[a-z0-9.-]+$

Rules:
  CloudFrontCertificateRegion:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: The CloudFront ACM certificate stack must be deployed in us-east-1.

Resources:
  StatusCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref StatusDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref StatusDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Application
          Value: i2g-status
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  CertificateArn:
    Description: us-east-1 ACM certificate ARN for CloudFront.
    Value: !Ref StatusCertificate
